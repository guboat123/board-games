<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>โป๊กเกอร์ · ก๊วนบอร์ดเกม</title>
<style>
/* ===========================================================
   โป๊กเกอร์มีหน้าตาของตัวเอง ไม่ใช้ธีมไวท์บอร์ดของเกมอื่น
   เพราะโต๊ะสักหลาดกับไพ่ต้องอ่านง่ายในที่แสงน้อย
   =========================================================== */
:root {
  --felt:        #14663f;
  --felt-deep:   #0d4a2d;
  --rail:        #2b1a10;
  --rail-light:  #462c1a;
  --gold:        #d8a441;
  --gold-dim:    #8a6a2a;
  --ink:         #0b0f0d;
  --paper:       #ffffff;
  --text:        #f2efe6;
  --muted:       #9fb0a6;
  --live:        #35d0c4;
  --danger:      #e2483c;
  --good:        #2fa85c;
  --chip:        #f0c419;
  --font: "IBM Plex Sans Thai", -apple-system, "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overscroll-behavior: none; }
body {
  background: #071a12;
  color: var(--text);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.45;
  user-select: none;
}
button { font-family: inherit; }

/* ---------- หน้าเข้าห้อง ---------- */
.join-wrap {
  min-height: 100%;
  display: flex; align-items: center; justify-content: center;
  padding: 22px 16px;
  background: radial-gradient(120% 90% at 50% 0%, #1b5c3c 0%, #071a12 70%);
}
.join {
  width: 100%; max-width: 380px;
  background: #0f231a;
  border: 1px solid #2c4a3a;
  border-radius: 18px;
  padding: 22px;
  box-shadow: 0 18px 50px rgba(0,0,0,.55);
}
.join h1 { margin: 0 0 4px; font-size: 1.55rem; letter-spacing: .01em; }
.join .sub { color: var(--muted); font-size: .88rem; margin: 0 0 18px; }
.fld { margin-bottom: 14px; }
.fld label { display: block; font-size: .82rem; color: var(--muted); margin-bottom: 6px; }
.fld input {
  width: 100%; padding: 12px 13px;
  font-family: inherit; font-size: 1rem;
  color: var(--text); background: #0a1a13;
  border: 1px solid #2c4a3a; border-radius: 10px;
}
.fld input:focus-visible { outline: 2px solid var(--live); outline-offset: 1px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.chips-row { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 8px; }
.qbtn {
  padding: 7px 12px; font-size: .82rem; font-family: var(--mono);
  color: var(--text); background: #14301f;
  border: 1px solid #2c4a3a; border-radius: 99px; cursor: pointer;
}
.qbtn:hover { border-color: var(--gold); }
.qbtn:focus-visible { outline: 2px solid var(--live); outline-offset: 2px; }
.btn-main {
  width: 100%; padding: 14px; margin-top: 6px;
  font-size: 1.02rem; font-weight: 700;
  color: #06170f; background: var(--gold);
  border: 0; border-radius: 11px; cursor: pointer;
}
.btn-main:disabled { opacity: .45; cursor: not-allowed; }
.btn-main:focus-visible { outline: 2px solid var(--live); outline-offset: 2px; }
.join .err { color: #ff8f84; font-size: .85rem; min-height: 1.2em; margin: 8px 0 0; }
.join .back { display: block; text-align: center; margin-top: 14px; color: var(--muted); font-size: .85rem; }

/* ---------- โครงหน้าโต๊ะ ---------- */
#game { display: none; height: 100%; flex-direction: column; }
#game.is-on { display: flex; }

.topbar {
  flex: 0 0 auto;
  display: flex; align-items: center; justify-content: space-between;
  gap: 10px; padding: 8px 12px;
  background: #082016; border-bottom: 1px solid #1d3a2b;
}
.topbar .blinds { font-family: var(--mono); font-size: .9rem; color: var(--gold); }
.topbar .hand { font-family: var(--mono); font-size: .72rem; color: var(--muted); }
.topbar a { color: var(--muted); text-decoration: none; font-size: .85rem; }

/* ---------- โต๊ะ ---------- */
.table-area { flex: 1 1 auto; position: relative; min-height: 0; padding: 10px; }
.felt {
  position: absolute; inset: 10px;
  border-radius: 46% / 34%;
  background:
    radial-gradient(70% 60% at 50% 42%, #1a7a4c 0%, var(--felt) 45%, var(--felt-deep) 100%);
  border: 11px solid var(--rail);
  box-shadow:
    inset 0 0 0 2px var(--gold-dim),
    inset 0 8px 30px rgba(0,0,0,.45),
    0 10px 30px rgba(0,0,0,.5);
}

.center {
  position: absolute; left: 50%; top: 46%;
  transform: translate(-50%, -50%);
  text-align: center; width: 92%;
}
.board { display: flex; gap: 5px; justify-content: center; }
.pot {
  display: inline-block; margin-top: 10px;
  padding: 5px 15px;
  font-family: var(--mono); font-size: .92rem; font-weight: 600;
  background: rgba(0,0,0,.45); border: 1px solid rgba(255,255,255,.16);
  border-radius: 99px;
}
.phase-tag {
  display: block; font-family: var(--mono); font-size: .66rem;
  letter-spacing: .18em; color: rgba(255,255,255,.5); margin-bottom: 7px;
}

/* ---------- ที่นั่ง ---------- */
.seat {
  position: absolute; width: 84px;
  transform: translate(-50%, -50%);
  text-align: center;
}
@media (min-width: 430px) { .seat { width: 104px; } }
.seat__box {
  background: linear-gradient(#16321f, #0e2417);
  border: 1px solid #2f5540; border-radius: 9px;
  padding: 5px 6px;
  box-shadow: 0 3px 10px rgba(0,0,0,.45);
}
.seat.is-turn .seat__box { border-color: var(--live); box-shadow: 0 0 0 2px rgba(53,208,196,.35), 0 3px 12px rgba(0,0,0,.5); }
.seat.is-folded { opacity: .42; }
.seat.is-me .seat__box { border-color: var(--gold); }
.seat__name {
  font-size: .76rem; font-weight: 600; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis;
}
.seat__stack { font-family: var(--mono); font-size: .8rem; color: var(--gold); }
.seat__box { max-width: 100%; }
.seat__cards { display: flex; gap: 2px; justify-content: center; margin-bottom: 3px; height: 30px; }
.seat__act {
  margin-top: 3px; font-size: .66rem; color: var(--muted);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.seat__off { font-size: .66rem; color: #7b8f84; }

.dealer {
  position: absolute; right: -7px; top: -7px;
  width: 20px; height: 20px; border-radius: 50%;
  background: var(--paper); color: #111;
  font: 700 .68rem/20px var(--mono); text-align: center;
  border: 1px solid #999;
}
.bet {
  position: absolute; left: 50%; transform: translateX(-50%);
  bottom: -22px;
  display: inline-flex; align-items: center; gap: 4px;
  font-family: var(--mono); font-size: .74rem;
  background: rgba(0,0,0,.5); padding: 2px 8px; border-radius: 99px;
  border: 1px solid rgba(255,255,255,.15);
  white-space: nowrap;
}
.bet::before {
  content: ""; width: 9px; height: 9px; border-radius: 50%;
  background: var(--chip); box-shadow: 0 0 0 1.5px #8a6d0d;
}

/* ---------- แถบไพ่ในมือ + แง้มดู ---------- */
.hand-area {
  flex: 0 0 auto; position: relative;
  height: 132px;
  background: linear-gradient(#0d3a25, #08281a);
  border-top: 3px solid var(--rail-light);
  display: flex; align-items: center; justify-content: center;
  touch-action: none;
}
.hand-hint {
  position: absolute; top: 8px; left: 0; right: 0;
  text-align: center; font-size: .74rem; color: rgba(255,255,255,.45);
  pointer-events: none;
}
.hole { position: relative; display: flex; gap: 8px; }
.hole .pc {
  transition: transform .16s ease;
  transform-origin: bottom center;
  box-shadow: 0 6px 16px rgba(0,0,0,.5);
}
/* ปกติไพ่คว่ำและกดจมอยู่ พอแง้มถึงเงยขึ้นมาเป็นมุม */
.hole.is-peek .pc:nth-child(1) { transform: rotate(-11deg) translateY(-16px); }
.hole.is-peek .pc:nth-child(2) { transform: rotate(7deg) translateY(-16px); }

.peek-knob {
  position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%);
  display: inline-flex; align-items: center; gap: 8px;
  padding: 9px 18px;
  font-size: .84rem; font-weight: 700; color: #06170f;
  background: linear-gradient(#f0cd72, var(--gold));
  border: 0; border-radius: 99px; cursor: grab;
  box-shadow: 0 3px 10px rgba(0,0,0,.45);
}
.peek-knob:active { cursor: grabbing; }
.peek-knob:focus-visible { outline: 2px solid var(--live); outline-offset: 3px; }
.peek-knob[disabled] { opacity: .35; }

/* ---------- แถบปุ่มลงมือ ---------- */
.actions {
  flex: 0 0 auto; padding: 9px 10px calc(9px + env(safe-area-inset-bottom));
  background: #082016; border-top: 1px solid #1d3a2b;
}
.act-row { display: flex; gap: 8px; }
.act {
  flex: 1 1 0; padding: 13px 8px;
  font-size: .95rem; font-weight: 700;
  color: var(--text); background: #1b3527;
  border: 1px solid #2f5540; border-radius: 10px; cursor: pointer;
}
.act:focus-visible { outline: 2px solid var(--live); outline-offset: 2px; }
.act[disabled] { opacity: .32; cursor: not-allowed; }
.act--fold  { background: #3a1d1a; border-color: #6b2f28; color: #ffb3ab; }
.act--call  { background: #1d4030; border-color: #2f6a4a; }
.act--raise { background: var(--gold); border-color: var(--gold); color: #06170f; }
.act small { display: block; font-family: var(--mono); font-size: .72rem; font-weight: 500; opacity: .85; }

/* แผงใส่จำนวนเงิน: วงกลม -/+ กับแป้นตัวเลข ใช้นิ้วง่ายกว่าแถบเลื่อน */
.bet-sheet {
  position: fixed; inset: 0; z-index: 70;
  background: rgba(3,12,8,.9);
  display: none; flex-direction: column; justify-content: flex-end;
}
.bet-sheet.is-on { display: flex; }
.bet-sheet__in {
  background: #0d2b1c; border-top: 2px solid var(--gold);
  border-radius: 16px 16px 0 0;
  padding: 14px 12px calc(12px + env(safe-area-inset-bottom));
}
.dial {
  display: flex; align-items: center; justify-content: center; gap: 14px;
  margin-bottom: 10px;
}
.dial__btn {
  flex: 0 0 auto; width: 52px; height: 52px;
  font-size: 1.7rem; font-weight: 700; line-height: 1;
  color: #06170f; background: linear-gradient(#f0cd72, var(--gold));
  border: 0; border-radius: 50%; cursor: pointer;
  box-shadow: 0 3px 8px rgba(0,0,0,.45);
}
.dial__btn:active { transform: translateY(1px); }
.dial__btn:focus-visible { outline: 2px solid var(--live); outline-offset: 3px; }
.dial__val {
  flex: 1 1 auto; max-width: 190px;
  background: #06170f; border: 2px solid var(--gold);
  border-radius: 14px; padding: 8px 10px; text-align: center;
}
.dial__lbl { font-size: .68rem; color: var(--muted); letter-spacing: .12em; }
.dial__num { font-family: var(--mono); font-size: 1.7rem; font-weight: 700; color: var(--gold); line-height: 1.1; }
.dial__hint { font-size: .68rem; color: var(--muted); }

.pad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 10px; }
.pad button {
  padding: 13px 0; font-family: var(--mono); font-size: 1.15rem; font-weight: 600;
  color: var(--text); background: #17342300; background-color: #1b3527;
  border: 1px solid #2f5540; border-radius: 9px; cursor: pointer;
}
.pad button:active { background-color: #234432; }
.pad button:focus-visible { outline: 2px solid var(--live); outline-offset: 2px; }
.pad .pad--ok { background-color: var(--gold); border-color: var(--gold); color: #06170f; font-weight: 700; grid-row: span 2; }
.pad .pad--cancel { background-color: #3a1d1a; border-color: #6b2f28; color: #ffb3ab; }

.waitbar { padding: 10px; text-align: center; }
.waitbar .msg { color: var(--muted); font-size: .88rem; margin-bottom: 8px; }

.log {
  flex: 0 0 auto; height: 24px; overflow: hidden;
  padding: 3px 12px; font-size: .74rem; color: var(--muted);
  background: #061a12; white-space: nowrap; text-overflow: ellipsis;
}
.toast {
  position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%);
  background: rgba(0,0,0,.85); color: #fff; padding: 9px 16px;
  border-radius: 99px; font-size: .85rem; z-index: 60;
  border: 1px solid rgba(255,255,255,.2);
  opacity: 0; pointer-events: none; transition: opacity .2s;
}
.toast.is-on { opacity: 1; }

/* ---------- ผลมือที่จบ ---------- */
.result {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
  width: min(92%, 400px); z-index: 40;
  background: rgba(6,22,15,.96); border: 1px solid var(--gold);
  border-radius: 14px; padding: 16px; text-align: center;
  box-shadow: 0 20px 50px rgba(0,0,0,.6);
  display: none;
}
.result.is-on { display: block; }
.result h3 { margin: 0 0 4px; font-size: 1.1rem; color: var(--gold); }
.result .row { display: flex; justify-content: space-between; gap: 10px; font-size: .85rem; padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,.08); }
.result .row b { font-family: var(--mono); color: var(--good); }
.result .hand-lbl { color: var(--muted); font-size: .78rem; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="cards.css">
</head>
<body>

<!-- ============ เข้าห้อง ============ -->
<div class="join-wrap" id="join-screen">
  <div class="join">
    <h1>โป๊กเกอร์</h1>
    <p class="sub">Texas Hold'em · เล่นแยกเครื่องในวง WiFi เดียวกัน</p>

    <div class="fld">
      <label for="f-name">ชื่อของคุณ</label>
      <input id="f-name" type="text" maxlength="16" placeholder="พิมพ์ชื่อ" autocomplete="off">
    </div>

    <div class="fld">
      <label for="f-room">รหัสห้อง (ทุกคนต้องใส่เหมือนกัน)</label>
      <input id="f-room" type="text" maxlength="8" value="HOME" autocomplete="off">
    </div>

    <div class="fld">
      <label for="f-chips">ชิปที่จะซื้อเข้าโต๊ะ — แต่ละคนไม่ต้องเท่ากัน</label>
      <input id="f-chips" type="number" min="1" step="1" value="1000">
      <div class="chips-row" id="chip-presets"></div>
    </div>

    <details style="margin:2px 0 14px">
      <summary style="cursor:pointer; color:var(--muted); font-size:.84rem">ตั้งค่าบอด (คนแรกที่เข้าห้องเป็นคนตั้ง)</summary>
      <div class="two" style="margin-top:10px">
        <div class="fld" style="margin:0">
          <label for="f-sb">บอดเล็ก</label>
          <input id="f-sb" type="number" min="1" step="1" value="10">
        </div>
        <div class="fld" style="margin:0">
          <label for="f-bb">บอดใหญ่</label>
          <input id="f-bb" type="number" min="1" step="1" value="20">
        </div>
      </div>
    </details>

    <button class="btn-main" id="btn-join">นั่งโต๊ะ</button>
    <p class="err" id="join-err"></p>
    <a class="back" href="../../index.html">← กลับไปหน้ารวมเกม</a>
  </div>
</div>

<!-- ============ โต๊ะ ============ -->
<div id="game">
  <div class="topbar">
    <a href="../../index.html">← ออก</a>
    <div>
      <div class="blinds" id="t-blinds">10 / 20</div>
      <div class="hand" id="t-hand">ห้อง —</div>
    </div>
    <div class="hand" id="t-me">—</div>
  </div>

  <div class="table-area" id="table-area">
    <div class="felt"></div>
    <div class="center">
      <span class="phase-tag" id="t-phase"></span>
      <div class="board" id="t-board"></div>
      <div class="pot" id="t-pot">กองกลาง 0</div>
    </div>
    <div class="result" id="t-result"></div>
  </div>

  <div class="log" id="t-log"></div>

  <div class="hand-area" id="hand-area">
    <div class="hand-hint" id="hand-hint">กดค้างที่ปุ่มทองเพื่อแง้มดูไพ่</div>
    <div class="hole" id="t-hole"></div>
    <button class="peek-knob" id="btn-peek">◈ แง้มดูไพ่</button>
  </div>

  <div class="actions" id="t-actions">
    <div class="act-row" id="act-row"></div>
  </div>
</div>

<!-- แผงใส่จำนวนเงิน -->
<div class="bet-sheet" id="bet-sheet">
  <div class="bet-sheet__in">
    <div class="dial">
      <button class="dial__btn" id="bet-minus" aria-label="ลดจำนวน">−</button>
      <div class="dial__val">
        <div class="dial__lbl" id="bet-label">เดิมพันรวมเป็น</div>
        <div class="dial__num" id="bet-num">0</div>
        <div class="dial__hint" id="bet-hint"></div>
      </div>
      <button class="dial__btn" id="bet-plus" aria-label="เพิ่มจำนวน">+</button>
    </div>

    <div class="chips-row" id="bet-quick" style="justify-content:center"></div>

    <div class="pad" id="bet-pad"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="cards.js"></script>
<script>
(function () {
  "use strict";

  var $ = function (id) { return document.getElementById(id); };

  var ws = null;
  var mySeat = -1;
  var view = null;
  var roomCode = "HOME";
  var peeking = false;

  /* ---------- แจ้งเตือนสั้นๆ ---------- */
  var toastTimer = null;
  function toast(msg) {
    var t = $("toast");
    t.textContent = msg;
    t.classList.add("is-on");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove("is-on"); }, 2200);
  }

  /* ---------- หน้าเข้าห้อง ---------- */

  var PRESETS = [500, 1000, 2000, 5000, 10000];
  (function buildPresets() {
    var host = $("chip-presets");
    PRESETS.forEach(function (v) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "qbtn";
      b.textContent = v.toLocaleString("th-TH");
      b.addEventListener("click", function () { $("f-chips").value = v; });
      host.appendChild(b);
    });
  })();

  /* จำค่าที่กรอกไว้ครั้งก่อน */
  try {
    var saved = JSON.parse(localStorage.getItem("bg.poker.v1") || "{}");
    if (saved.name) $("f-name").value = saved.name;
    if (saved.room) $("f-room").value = saved.room;
    if (saved.chips) $("f-chips").value = saved.chips;
  } catch (e) { /* โหมดส่วนตัว ไม่เป็นไร */ }

  if (location.hash.length > 1) $("f-room").value = decodeURIComponent(location.hash.slice(1)).toUpperCase();

  $("btn-join").addEventListener("click", join);
  $("f-name").addEventListener("keydown", function (e) { if (e.key === "Enter") join(); });

  function join() {
    var name = $("f-name").value.trim();
    var room = ($("f-room").value.trim() || "HOME").toUpperCase();
    var chips = Math.floor(Number($("f-chips").value));

    if (!name) { $("join-err").textContent = "ใส่ชื่อก่อน"; $("f-name").focus(); return; }
    if (!isFinite(chips) || chips <= 0) { $("join-err").textContent = "ใส่จำนวนชิปที่จะซื้อ"; return; }

    try {
      localStorage.setItem("bg.poker.v1", JSON.stringify({ name: name, room: room, chips: chips }));
    } catch (e) { /* ข้ามไป */ }

    roomCode = room;
    $("join-err").textContent = "กำลังต่อ...";
    $("btn-join").disabled = true;

    var proto = location.protocol === "https:" ? "wss://" : "ws://";
    ws = new WebSocket(proto + location.host);

    ws.onopen = function () {
      ws.send(JSON.stringify({
        type: "join", room: room, name: name, buyIn: chips
      }));
      /* คนแรกที่เข้าเป็นคนตั้งบอด ถ้าโต๊ะยังว่าง ฝั่งเซิร์ฟเวอร์จะรับไว้ */
      ws.send(JSON.stringify({
        type: "config",
        smallBlind: Math.floor(Number($("f-sb").value)) || 10,
        bigBlind: Math.floor(Number($("f-bb").value)) || 20
      }));
    };

    ws.onmessage = function (ev) {
      var msg;
      try { msg = JSON.parse(ev.data); } catch (e) { return; }

      if (msg.type === "joined") {
        mySeat = msg.seatId;
        $("join-screen").style.display = "none";
        $("game").classList.add("is-on");
        $("t-hand").textContent = "ห้อง " + msg.room;
        location.hash = msg.room;
      } else if (msg.type === "state") {
        view = msg.state;
        render();
      } else if (msg.type === "error") {
        toast(msg.message);
        $("join-err").textContent = msg.message;
        $("btn-join").disabled = false;
      }
    };

    ws.onclose = function () {
      $("btn-join").disabled = false;
      if ($("game").classList.contains("is-on")) toast("หลุดจากโต๊ะ ลองเปิดหน้านี้ใหม่");
      else $("join-err").innerHTML = hostedHint();
    };

    ws.onerror = function () {
      $("join-err").innerHTML = hostedHint();
      $("btn-join").disabled = false;
    };
  }

  /* โป๊กเกอร์ต้องมีตัวกลาง เปิดจาก GitHub Pages เฉยๆ จะต่อไม่ได้
     บอกวิธีให้ชัดแทนที่จะขึ้นว่า error เฉยๆ */
  function hostedHint() {
    if (location.protocol === "file:" || /github\.io$/.test(location.hostname)) {
      return "เกมนี้ต้องรันตัวกลางก่อน เปิดหน้านี้จากลิงก์ GitHub เฉยๆ เล่นไม่ได้<br>" +
             "บนเครื่องเจ้าภาพ สั่ง <code>node lan/server.mjs</code> " +
             "แล้วทุกคนเปิดที่ <code>http://ไอพีเครื่องนั้น:8080</code>";
    }
    return "ต่อตัวกลางไม่ได้ ตรวจว่ารัน node lan/server.mjs อยู่ไหม";
  }

  function send(obj) {
    if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj));
  }

  /* ---------- แง้มดูไพ่ ---------- */

  function setPeek(on) {
    peeking = on;
    var hole = $("t-hole");
    hole.classList.toggle("is-peek", on);
    paintHole();
  }

  var knob = $("btn-peek");
  ["pointerdown"].forEach(function (e) {
    knob.addEventListener(e, function (ev) { ev.preventDefault(); setPeek(true); });
  });
  ["pointerup", "pointercancel", "pointerleave"].forEach(function (e) {
    knob.addEventListener(e, function () { setPeek(false); });
  });
  /* คีย์บอร์ด: กดค้าง Space/Enter ก็แง้มได้ */
  knob.addEventListener("keydown", function (e) {
    if (e.key === " " || e.key === "Enter") { e.preventDefault(); setPeek(true); }
  });
  knob.addEventListener("keyup", function () { setPeek(false); });
  window.addEventListener("blur", function () { setPeek(false); });

  function paintHole() {
    var host = $("t-hole");
    host.innerHTML = "";
    if (!view || mySeat < 0) return;
    var me = view.seats[mySeat];
    if (!me || !me.cards.length) {
      $("hand-hint").textContent = view.phase === "waiting"
        ? "รอเริ่มมือใหม่" : "รอบนี้คุณไม่ได้ร่วมมือ";
      knob.disabled = true;
      return;
    }
    knob.disabled = false;
    $("hand-hint").textContent = peeking ? "" : "กดค้างที่ปุ่มทองเพื่อแง้มดูไพ่";

    me.cards.forEach(function (c) {
      host.appendChild(window.Cards.make(peeking ? c : "??", "lg"));
    });
  }

  /* ---------- วางที่นั่งรอบโต๊ะ ---------- */

  /* ตำแหน่ง 9 ที่นั่งรอบวงรี เป็นเปอร์เซ็นต์ของพื้นที่โต๊ะ
     ที่นั่งของเราจะถูกหมุนให้มาอยู่ล่างสุดเสมอ */
  var SPOTS = [
    [50, 95],                      /* ตัวเราอยู่ล่างสุดเสมอ */
    [17, 86], [15, 62], [21, 36], [37, 16],
    [63, 16], [79, 36], [85, 62], [83, 86]
  ];

  function seatOrder() {
    /* เรียงที่นั่งจริงให้ตัวเราอยู่ช่องแรก (ล่างสุด) */
    var n = view.seats.length, out = [];
    var base = mySeat >= 0 ? mySeat : 0;
    for (var i = 0; i < n; i++) out.push((base + i) % n);
    return out;
  }

  function render() {
    if (!view) return;

    $("t-blinds").textContent = view.blinds.sb + " / " + view.blinds.bb;
    var me = view.seats[mySeat];
    $("t-me").textContent = me ? me.stack.toLocaleString("th-TH") + " ชิป" : "—";

    var PHASE = {
      waiting: "รอเริ่ม", preflop: "พรีฟลอป", flop: "ฟลอป",
      turn: "เทิร์น", river: "ริเวอร์", showdown: "เปิดไพ่"
    };
    $("t-phase").textContent = PHASE[view.phase] || "";
    $("t-pot").textContent = "กองกลาง " + view.pot.toLocaleString("th-TH");
    $("t-log").textContent = (view.log && view.log.length) ? view.log[view.log.length - 1] : "";

    /* ไพ่กลาง 5 ช่อง */
    var board = $("t-board");
    board.innerHTML = "";
    for (var i = 0; i < 5; i++) {
      board.appendChild(view.board[i]
        ? window.Cards.make(view.board[i], "md")
        : window.Cards.slot("md"));
    }

    /* ถ้าไม่ใช่ตาเราแล้ว ปิดแผงใส่เงินทิ้ง */
    if (view.current !== mySeat) $("bet-sheet").classList.remove("is-on");

    paintSeats();
    paintHole();
    paintActions();
    paintResult();
  }

  function paintSeats() {
    var area = $("table-area");
    /* ลบที่นั่งเดิมออกก่อน (เก็บ felt / center / result ไว้) */
    Array.prototype.slice.call(area.querySelectorAll(".seat")).forEach(function (n) { n.remove(); });

    var order = seatOrder();
    order.forEach(function (seatId, slotIdx) {
      var s = view.seats[seatId];
      if (!s) return;

      var spot = SPOTS[slotIdx % SPOTS.length];
      var el = document.createElement("div");
      el.className = "seat"
        + (seatId === view.current ? " is-turn" : "")
        + (s.folded ? " is-folded" : "")
        + (seatId === mySeat ? " is-me" : "");
      el.style.left = spot[0] + "%";
      el.style.top = spot[1] + "%";

      /* ไพ่คว่ำเล็กๆ ข้างชื่อ */
      var cards = document.createElement("div");
      cards.className = "seat__cards";
      if (s.inHand && s.cards.length && !s.folded) {
        s.cards.forEach(function (c) {
          /* ไพ่ตัวเองบนโต๊ะยังคว่ำไว้ ดูได้จากแถบล่างเท่านั้น */
          cards.appendChild(window.Cards.make(
            (seatId === mySeat && !peeking) ? "??" : c, "sm"));
        });
      }
      el.appendChild(cards);

      var box = document.createElement("div");
      box.className = "seat__box";

      var nm = document.createElement("div");
      nm.className = "seat__name";
      nm.textContent = s.name;
      box.appendChild(nm);

      var stk = document.createElement("div");
      stk.className = "seat__stack";
      stk.textContent = s.stack.toLocaleString("th-TH");
      box.appendChild(stk);

      if (!s.connected) {
        var off = document.createElement("div");
        off.className = "seat__off";
        off.textContent = "หลุด";
        box.appendChild(off);
      } else if (s.sitOut) {
        var so = document.createElement("div");
        so.className = "seat__off";
        so.textContent = "พักมือ";
        box.appendChild(so);
      } else if (s.lastAction) {
        var la = document.createElement("div");
        la.className = "seat__act";
        la.textContent = s.lastAction;
        box.appendChild(la);
      }

      if (seatId === view.button) {
        var d = document.createElement("span");
        d.className = "dealer";
        d.textContent = "D";
        box.appendChild(d);
      }

      box.style.position = "relative";
      el.appendChild(box);

      if (s.bet > 0) {
        var b = document.createElement("span");
        b.className = "bet";
        b.textContent = s.bet.toLocaleString("th-TH");
        el.appendChild(b);
      }

      area.appendChild(el);
    });
  }

  /* ---------- ปุ่มลงมือ ---------- */

  function paintActions() {
    var row = $("act-row");
    row.innerHTML = "";

    var me = view.seats[mySeat];
    if (!me) return;

    /* ยังไม่เริ่มมือ หรือมือเพิ่งจบ */
    if (view.phase === "waiting" || view.phase === "showdown") {
      var start = mkBtn("act act--raise",
        view.phase === "showdown" ? "มือต่อไป" : "เริ่มเล่น",
        view.readyCount >= 2 ? null : "ต้องมีอย่างน้อย 2 คน",
        function () { send({ type: "start" }); });
      start.disabled = view.readyCount < 2;
      row.appendChild(start);

      if (me.stack <= 0) {
        row.appendChild(mkBtn("act", "เติมชิป", null, function () {
          var v = prompt("เติมชิปเท่าไหร่", String(view.buyInRange.suggested));
          if (v) send({ type: "rebuy", amount: Number(v) });
        }));
      }
      return;
    }

    /* ไม่ใช่ตาเรา */
    if (view.current !== mySeat) {
      var who = view.seats[view.current];
      var wait = document.createElement("div");
      wait.className = "waitbar";
      wait.innerHTML = "<div class='msg'>" +
        (me.folded ? "คุณหมอบแล้ว" : (me.allIn ? "คุณหมดหน้าตักแล้ว" : "รอ " + (who ? who.name : "—"))) +
        "</div>";
      row.appendChild(wait);
      return;
    }

    var toCall = view.toCall;
    var maxTarget = me.stack + me.bet;

    row.appendChild(mkBtn("act act--fold", "หมอบ", null, function () {
      send({ type: "act", action: "fold" });
    }));

    if (toCall > 0) {
      var canCall = Math.min(toCall, me.stack);
      row.appendChild(mkBtn("act act--call", "ตาม", canCall.toLocaleString("th-TH"), function () {
        send({ type: "act", action: "call" });
      }));
    } else {
      row.appendChild(mkBtn("act act--call", "เคาะ", null, function () {
        send({ type: "act", action: "check" });
      }));
    }

    /* เพิ่มเดิมพันได้เมื่อยังมีชิปเหลือมากกว่าที่ต้องตาม */
    if (me.stack > toCall) {
      var minTarget = Math.min(view.currentBet + view.minRaise, maxTarget);
      var raiseBtn = mkBtn("act act--raise", toCall > 0 ? "เพิ่ม" : "เดิมพัน", null, function () {
        openRaise(minTarget, maxTarget);
      });
      row.appendChild(raiseBtn);
    } else if (me.stack > 0) {
      row.appendChild(mkBtn("act act--raise", "หมดหน้าตัก", maxTarget.toLocaleString("th-TH"), function () {
        send({ type: "act", action: "raise", amount: maxTarget });
      }));
    }
  }

  function mkBtn(cls, label, sub, onClick) {
    var b = document.createElement("button");
    b.type = "button";
    b.className = cls;
    b.textContent = label;
    if (sub) {
      var s = document.createElement("small");
      s.textContent = sub;
      b.appendChild(s);
    }
    b.addEventListener("click", onClick);
    return b;
  }

  /* ---------- แผงใส่จำนวนเงิน ---------- */

  var betMin = 0, betMax = 0, betVal = 0, betTyping = false;

  function clampBet(v) {
    if (!isFinite(v)) v = betMin;
    return Math.max(betMin, Math.min(betMax, Math.floor(v)));
  }

  function paintBet() {
    $("bet-num").textContent = betVal.toLocaleString("th-TH");
    $("bet-hint").textContent = "ต่ำสุด " + betMin.toLocaleString("th-TH") +
                                " · สูงสุด " + betMax.toLocaleString("th-TH");
  }

  function setBet(v) { betVal = clampBet(v); paintBet(); }

  function openRaise(minTarget, maxTarget) {
    betMin = minTarget;
    betMax = maxTarget;
    betVal = minTarget;
    betTyping = false;
    $("bet-label").textContent = view.toCall > 0 ? "เพิ่มเป็น" : "เดิมพัน";
    paintBet();

    /* ปุ่มลัด */
    var quick = $("bet-quick");
    quick.innerHTML = "";
    /* ขนาดกองตามหลักโป๊กเกอร์: ตามก่อน แล้วเพิ่มเท่ากองหลังตามแล้ว
       เช่น กอง 30 ต้องตาม 20 -> เพิ่มเป็น 20 + (30+20) = 70 */
    var potAfterCall = view.pot + view.toCall;
    [
      { label: "ต่ำสุด", value: minTarget },
      { label: "½ กอง", value: view.currentBet + Math.round(potAfterCall / 2) },
      { label: "กอง",   value: view.currentBet + potAfterCall },
      { label: "หมดตัก", value: maxTarget }
    ].forEach(function (q) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "qbtn";
      b.textContent = q.label;
      b.addEventListener("click", function () { betTyping = false; setBet(q.value); });
      quick.appendChild(b);
    });

    $("bet-sheet").classList.add("is-on");
  }

  function closeRaise() {
    $("bet-sheet").classList.remove("is-on");
    paintActions();
  }

  /* แป้นตัวเลข */
  (function buildPad() {
    var pad = $("bet-pad");
    var keys = ["7","8","9","del","4","5","6","ok","1","2","3","cancel","0","000"];
    keys.forEach(function (k) {
      var b = document.createElement("button");
      b.type = "button";
      if (k === "del")        { b.textContent = "⌫"; }
      else if (k === "ok")    { b.textContent = "ตกลง"; b.className = "pad--ok"; }
      else if (k === "cancel"){ b.textContent = "ยกเลิก"; b.className = "pad--cancel"; }
      else                    { b.textContent = k; }

      b.addEventListener("click", function () {
        if (k === "ok") {
          send({ type: "act", action: "raise", amount: betVal });
          $("bet-sheet").classList.remove("is-on");
          return;
        }
        if (k === "cancel") { closeRaise(); return; }
        if (k === "del") {
          var s2 = String(betTyping ? betVal : "").slice(0, -1);
          betVal = s2 ? Number(s2) : 0;
          betTyping = true;
          $("bet-num").textContent = betVal.toLocaleString("th-TH");
          return;
        }
        /* พิมพ์ตัวเลขต่อท้าย ยังไม่ clamp ระหว่างพิมพ์ จะได้พิมพ์เลขยาวได้ */
        var cur = betTyping ? String(betVal) : "";
        var next = Number(cur + k);
        if (next > betMax) next = betMax;
        betVal = next;
        betTyping = true;
        $("bet-num").textContent = betVal.toLocaleString("th-TH");
      });
      pad.appendChild(b);
    });
  })();

  /* ปุ่ม - / + ขยับทีละบิ๊กบลายด์ */
  $("bet-minus").addEventListener("click", function () {
    betTyping = false;
    setBet(betVal - (view ? view.blinds.bb : 1));
  });
  $("bet-plus").addEventListener("click", function () {
    betTyping = false;
    setBet(betVal + (view ? view.blinds.bb : 1));
  });
  $("bet-sheet").addEventListener("click", function (e) {
    if (e.target === $("bet-sheet")) closeRaise();
  });

  /* ---------- ผลมือที่จบ ---------- */

  function paintResult() {
    var box = $("t-result");
    var r = view.lastResult;
    if (!r || view.phase !== "showdown") { box.classList.remove("is-on"); return; }

    box.innerHTML = "";
    var h = document.createElement("h3");
    h.textContent = r.showdown ? "เปิดไพ่" : "จบมือ";
    box.appendChild(h);

    r.payouts.forEach(function (p) {
      var row = document.createElement("div");
      row.className = "row";
      var left = document.createElement("span");
      var rv = r.reveal.filter(function (x) { return x.seatId === p.seatId; })[0];
      left.innerHTML = p.name + (rv ? " <span class='hand-lbl'>" + rv.hand + "</span>" : "");
      var right = document.createElement("b");
      right.textContent = "+" + p.amount.toLocaleString("th-TH");
      row.appendChild(left);
      row.appendChild(right);
      box.appendChild(row);
    });

    box.classList.add("is-on");
  }

})();
</script>
</body>
</html>
