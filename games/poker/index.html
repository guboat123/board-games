<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>โป๊กเกอร์ · ก๊วนบอร์ดเกม</title>
<style>
/* ===========================================================
   โป๊กเกอร์มีหน้าตาของตัวเอง ไม่ใช้ธีมไวท์บอร์ดของเกมอื่น
   เพราะโต๊ะสักหลาดกับไพ่ต้องอ่านง่ายในที่แสงน้อย
   =========================================================== */
:root {
  --felt:        #14663f;
  --felt-deep:   #0d4a2d;
  --rail:        #2b1a10;
  --rail-light:  #462c1a;
  --gold:        #d8a441;
  --gold-dim:    #8a6a2a;
  --ink:         #0b0f0d;
  --paper:       #ffffff;
  --text:        #f2efe6;
  --muted:       #9fb0a6;
  --live:        #35d0c4;
  --danger:      #e2483c;
  --good:        #2fa85c;
  --chip:        #f0c419;
  --font: "IBM Plex Sans Thai", -apple-system, "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overscroll-behavior: none; }
body {
  background: #071a12;
  color: var(--text);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.45;
  user-select: none;
  /* หน้านี้ไม่มีอะไรที่ต้องเลื่อนแนวนอน
     เหรียญดีลเลอร์ของที่นั่งขวาสุดโผล่ออกนอกจอ 2px ทำให้เลื่อนได้ทั้งหน้า ซึ่งกวนมือตอนเล่น */
  overflow-x: hidden;
}
button { font-family: inherit; }

/* ---------- หน้าเข้าห้อง ---------- */
.join-wrap {
  min-height: 100%;
  display: flex; align-items: center; justify-content: center;
  padding: 22px 16px;
  background: radial-gradient(120% 90% at 50% 0%, #1b5c3c 0%, #071a12 70%);
}
.join {
  width: 100%; max-width: 380px;
  background: #0f231a;
  border: 1px solid #2c4a3a;
  border-radius: 18px;
  padding: 22px;
  box-shadow: 0 18px 50px rgba(0,0,0,.55);
}
.join h1 { margin: 0 0 4px; font-size: 1.55rem; letter-spacing: .01em; }
.join .sub { color: var(--muted); font-size: .88rem; margin: 0 0 18px; }
.fld { margin-bottom: 14px; }
.fld label { display: block; font-size: .82rem; color: var(--muted); margin-bottom: 6px; }
.fld input {
  width: 100%; padding: 12px 13px;
  font-family: inherit; font-size: 1rem;
  color: var(--text); background: #0a1a13;
  border: 1px solid #2c4a3a; border-radius: 10px;
}
.fld input:focus-visible { outline: 2px solid var(--live); outline-offset: 1px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.chips-row { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 8px; }
.qbtn {
  padding: 7px 12px; font-size: .82rem; font-family: var(--mono);
  color: var(--text); background: #14301f;
  border: 1px solid #2c4a3a; border-radius: 99px; cursor: pointer;
}
.qbtn:hover { border-color: var(--gold); }
.qbtn:focus-visible { outline: 2px solid var(--live); outline-offset: 2px; }
.btn-main {
  width: 100%; padding: 14px; margin-top: 6px;
  font-size: 1.02rem; font-weight: 700;
  color: #06170f; background: var(--gold);
  border: 0; border-radius: 11px; cursor: pointer;
}
/* เหตุผลเดียวกับ .act[disabled] ข้างล่าง ปุ่มทองพอหรี่แล้วตัวหนังสือจะหายไปกับพื้น */
.btn-main:disabled { cursor: not-allowed; background: #24402f; color: #a9c8b6; }
.btn-main:focus-visible { outline: 2px solid var(--live); outline-offset: 2px; }
.hint-sm { font-size: .78rem; color: var(--muted); margin: 6px 0 0; }

/* รายการโต๊ะที่เปิดอยู่ */
.tables { margin-bottom: 16px; }
#tables-list { max-height: 40vh; overflow-y: auto; }
.tables h2 { font-size: .84rem; color: var(--muted); font-weight: 500; margin: 0 0 8px; }
.tbl {
  width: 100%; text-align: left;
  display: flex; align-items: center; gap: 10px;
  padding: 11px 13px; margin-bottom: 7px;
  background: #14301f; color: var(--text);
  border: 1px solid #2f5540; border-radius: 11px; cursor: pointer;
}
.tbl:hover { border-color: var(--gold); }
.tbl:focus-visible { outline: 2px solid var(--live); outline-offset: 2px; }
.tbl.is-on { border-color: var(--gold); background: #1c3f28; }
.tbl__code { font-family: var(--mono); font-weight: 700; font-size: 1rem; color: var(--gold); }
.tbl__meta { flex: 1 1 auto; min-width: 0; }
/* ต้องเป็น block ไม่งั้น overflow/ellipsis ไม่มีผลกับ inline box
   แล้วรายชื่อยาวๆ จะลอดไปทับป้ายจำนวนคนด้านขวา */
.tbl__who { display: block; min-width: 0; font-size: .78rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tbl__n {
  flex: 0 0 auto; font-family: var(--mono); font-size: .78rem;
  padding: 3px 9px; border-radius: 99px;
  background: rgba(0,0,0,.35); border: 1px solid rgba(255,255,255,.14);
}
.tbl__live { color: var(--live); }
/* เลือกที่นั่ง */
.seatpick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; margin-top: 8px; }
.sp {
  padding: 9px 4px; text-align: center;
  font-family: var(--mono); font-size: .8rem;
  color: var(--text); background: #14301f;
  border: 1px solid #2c4a3a; border-radius: 9px; cursor: pointer;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.sp small { display: block; font-family: var(--font); font-size: .68rem; color: var(--muted); }
.sp.is-on { background: var(--gold); border-color: var(--gold); color: #06170f; }
.sp.is-on small { color: #06170f; opacity: .75; }
.sp.is-taken { opacity: .4; cursor: not-allowed; }
.sp.is-away { border-color: var(--live); }
.sp:focus-visible { outline: 2px solid var(--live); outline-offset: 2px; }
.tables .none {
  padding: 12px; text-align: center; font-size: .82rem; color: var(--muted);
  border: 1px dashed #2c4a3a; border-radius: 11px;
}
.qbtn.is-on { background: var(--gold); color: #06170f; border-color: var(--gold); font-weight: 700; }
.join .err { color: #ff8f84; font-size: .85rem; min-height: 1.2em; margin: 8px 0 0; }
.join .back { display: block; text-align: center; margin-top: 14px; color: var(--muted); font-size: .85rem; }

/* ---------- โครงหน้าโต๊ะ ---------- */
#game { display: none; height: 100%; flex-direction: column; }
#game.is-on { display: flex; }

.topbar {
  flex: 0 0 auto;
  display: flex; align-items: center; justify-content: space-between;
  gap: 10px; padding: 8px 12px;
  background: #082016; border-bottom: 1px solid #1d3a2b;
}
.topbar .blinds { font-family: var(--mono); font-size: .9rem; color: var(--gold); }
.topbar .hand { font-family: var(--mono); font-size: .72rem; color: var(--muted); }
.topbar a { color: var(--muted); text-decoration: none; font-size: .85rem; }
.topbtn {
  flex: 0 0 auto; padding: 6px 10px; font-family: inherit;
  font-size: .8rem; font-weight: 700;
  color: var(--gold); background: #102b1e;
  border: 1px solid #2b4b37; border-radius: 9px; cursor: pointer;
}
.topbtn:focus-visible { outline: 2px solid var(--live); outline-offset: 2px; }
/* แผงสรุปโต๊ะ ใช้เปลือกเดียวกับกล่องผล แต่สูงกว่าเพราะมี 9 แถวเสมอ */
#t-table.is-on { max-height: 84%; }
#t-table .rows { min-height: 64px; }
.mhead, .mrow {
  display: grid; grid-template-columns: 1fr auto auto;
  gap: 8px 10px; align-items: center; text-align: left;
}
.mhead { font-size: .7rem; color: var(--muted); padding-bottom: 4px; }
.mrow { font-size: .85rem; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,.08); }
.mrow .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mrow .num { font-family: var(--mono); }
.mrow .buy { color: var(--muted); font-size: .76rem; }
.mrow--free .nm { color: var(--muted); }
.mseat {
  padding: 5px 9px; font-family: inherit; font-size: .78rem; font-weight: 700;
  color: #06170f; background: var(--gold); border: 0; border-radius: 8px; cursor: pointer;
}
.mseat[disabled] { background: #24402f; color: #a9c8b6; cursor: not-allowed; }
.mseat:focus-visible { outline: 2px solid var(--live); outline-offset: 2px; }

/* ---------- โต๊ะ ---------- */
.table-area { flex: 1 1 auto; position: relative; min-height: 0; padding: 10px; }
.felt {
  position: absolute; inset: 10px;
  border-radius: 46% / 34%;
  background:
    radial-gradient(70% 60% at 50% 42%, #1a7a4c 0%, var(--felt) 45%, var(--felt-deep) 100%);
  border: 11px solid var(--rail);
  box-shadow:
    inset 0 0 0 2px var(--gold-dim),
    inset 0 8px 30px rgba(0,0,0,.45),
    0 10px 30px rgba(0,0,0,.5);
}

.center {
  position: absolute; left: 50%; top: 47%;
  transform: translate(-50%, -50%);
  text-align: center; width: 92%;
  /* ไพ่กลางคือสิ่งที่ทุกคนต้องอ่าน ต้องอยู่บนที่นั่งเสมอ */
  z-index: 3; pointer-events: none;
}
/* ---------- แจกไพ่ ----------
   เฉพาะใบที่เพิ่งลงมาใหม่เท่านั้นที่วิ่ง ใบเดิมอยู่นิ่ง
   ไม่งั้นทุกครั้งที่เซิร์ฟเวอร์ส่ง state มา (ทุกการกดของทุกคน) ไพ่ทั้งแถวจะกระตุกพร้อมกัน */
@keyframes deal-in {
  from { opacity: 0; transform: translateY(-46px) scale(.82) rotate(-8deg); }
  60%  { opacity: 1; }
  to   { opacity: 1; transform: none; }
}
.pc.is-dealt { animation: deal-in .38s cubic-bezier(.18,.85,.3,1) backwards; }
/* ---------- เปิดไพ่ ----------
   จังหวะเปิดไพ่คือจังหวะที่ทุกคนรออยู่ ให้ไพ่พลิกหงายทีละใบ ไม่ใช่เปลี่ยนภาพเฉยๆ
   พลิกครั้งเดียวต่อมือ ไม่ใช่ทุกครั้งที่หน้าจอวาดใหม่ */
@keyframes flip-in {
  from { transform: rotateY(88deg) scale(.86); opacity: .2; }
  to   { transform: none; opacity: 1; }
}
.pc.is-flip { animation: flip-in .46s cubic-bezier(.2,.85,.3,1) backwards; }
/* ⚠️ ต้องคง translateX(-50%) ไว้ทุกเฟรม กล่องผลจัดกลางด้วย transform
   ถ้าเฟรมไหนไม่ใส่ กล่องจะกระโดดไปชิดซ้ายระหว่างวิ่ง */
@keyframes result-pop {
  from { opacity: 0; transform: translateX(-50%) translateY(16px) scale(.94); }
  to   { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
}
.result.is-pop { animation: result-pop .4s cubic-bezier(.2,.85,.3,1) backwards; }
@keyframes win-pop {
  from { transform: scale(.55); opacity: 0; }
  60%  { transform: scale(1.18); opacity: 1; }
  to   { transform: none; opacity: 1; }
}
/* ยอดเงินที่ได้เด้งตามมาทีหลังไพ่นิดหนึ่ง จะได้อ่านทันว่าใครได้เท่าไหร่ */
.result.is-pop .row b { display: inline-block; animation: win-pop .5s .2s cubic-bezier(.2,.85,.3,1) backwards; }
@keyframes pot-bump {
  from { transform: scale(1); }
  45%  { transform: scale(1.16); }
  to   { transform: scale(1); }
}
.pot.is-bump { animation: pot-bump .32s ease-out; }
.board { display: flex; gap: 5px; justify-content: center; }
/* ไพ่กลางต้องแคบพอที่จะไม่ชนที่นั่งซ้าย/ขวา (อยู่ที่ 11% กับ 89% ของโต๊ะ)
   มุมไพ่ใบแรกกับใบที่ห้าคือที่พิมพ์เลขหน้าไพ่ไว้ ถ้าโดนทับก็อ่านไม่ออก
   ผูกกับ vw ตรงๆ แทนการตั้ง breakpoint จะได้ไม่มีจุดที่พังเป็นช่วงๆ
   10.1vw = ค่ากว้างสุดที่ยังไม่ชนที่นั่ง ตั้งแต่ 360px ขึ้นไป */
.board .pc--md { width: min(54px, 10.1vw); font-size: min(8.8px, 1.65vw); }
.pot {
  display: inline-block; margin-top: 10px;
  padding: 5px 15px;
  font-family: var(--mono); font-size: .92rem; font-weight: 600;
  background: rgba(0,0,0,.45); border: 1px solid rgba(255,255,255,.16);
  border-radius: 99px;
}
.phase-tag {
  display: block; font-family: var(--mono); font-size: .66rem;
  letter-spacing: .18em; color: rgba(255,255,255,.5); margin-bottom: 7px;
}

/* ---------- ที่นั่ง ---------- */
.seat {
  position: absolute;
  /* ค่อยๆ กว้างขึ้นตามจอ ไม่ใช่กระโดดทีเดียว
     ของเดิมกระโดด 76 -> 104px ที่ 430px พอดี ซึ่งเป็นความกว้างของ iPhone Pro Max
     ทำให้ที่นั่งล้นขอบจอและทับกันเองบนเครื่องที่คนใช้จริงกันเยอะ */
  width: clamp(70px, 19vw, 104px);
  transform: translate(-50%, -50%);
  text-align: center;
  z-index: 2;
}
.seat__box {
  background: linear-gradient(#16321f, #0e2417);
  border: 1px solid #2f5540; border-radius: 9px;
  padding: 5px 6px;
  box-shadow: 0 3px 10px rgba(0,0,0,.45);
}
.seat.is-turn .seat__box { border-color: var(--live); box-shadow: 0 0 0 2px rgba(53,208,196,.35), 0 3px 12px rgba(0,0,0,.5); }
.seat.is-folded { opacity: .42; }
.seat.is-me .seat__box { border-color: var(--gold); }
.seat__name {
  font-size: .76rem; font-weight: 600; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis;
}
.seat__stack { font-family: var(--mono); font-size: .8rem; color: var(--gold); }
.seat__box { max-width: 100%; }
.seat__cards { display: flex; gap: 2px; justify-content: center; margin-bottom: 3px; height: 30px; }
/* ไพ่ต้องพอดีกับกล่อง ไม่งั้นล้นออกไปทับที่นั่งข้างเคียง
   pc--sm กว้าง 24px จะสูง 33.6px (อัตราส่วน 5/7) ซึ่งเกินกล่อง 30px ไป 3.6px */
.seat__cards .pc--sm { width: 21px; font-size: 4.8px; }
.seat__act {
  margin-top: 3px; font-size: .66rem; color: var(--muted);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.seat__off { font-size: .66rem; color: #7b8f84; }

.dealer {
  position: absolute; right: -7px; top: -7px;
  width: 20px; height: 20px; border-radius: 50%;
  background: var(--paper); color: #111;
  font: 700 .68rem/20px var(--mono); text-align: center;
  border: 1px solid #999;
}
.bet {
  position: absolute; left: 50%; transform: translateX(-50%);
  bottom: -22px;
  display: inline-flex; align-items: center; gap: 4px;
  font-family: var(--mono); font-size: .74rem;
  background: rgba(0,0,0,.5); padding: 2px 8px; border-radius: 99px;
  border: 1px solid rgba(255,255,255,.15);
  white-space: nowrap;
}
.bet::before {
  content: ""; width: 9px; height: 9px; border-radius: 50%;
  background: var(--chip); box-shadow: 0 0 0 1.5px #8a6d0d;
}

/* ⚠️ media query ต้องอยู่ "หลัง" กฎพื้นฐานที่ selector เหมือนกันเป๊ะ
   เพราะ media query ไม่เพิ่ม specificity กฎที่อยู่ทีหลังจะชนะเสมอ
   เคยวางไว้ข้างบนแล้วการย่อไพ่/ชิปบนจอเตี้ยถูกลบทิ้งทั้งชุดโดยไม่มีใครรู้ */
@media (max-width: 380px) {
  .seat__cards { height: 25px; }
  .seat__cards .pc--sm { width: 17px; font-size: 3.9px; }
}
/* จอเตี้ย วงที่นั่งบีบกันทั้งแนวตั้งและแนวนอน ต้องย่อที่นั่งทั้งก้อน
   ไม่ใช่ย่อแค่ไพ่ ไม่งั้นกล่องที่นั่งจะไปทับไพ่กลางและทับที่นั่งข้างเคียง */
@media (max-height: 700px) {
  .seat { width: clamp(52px, 13.5vw, 76px); }
  .seat__cards { height: 17px; margin-bottom: 2px; }
  .seat__cards .pc--sm { width: 12px; font-size: 2.7px; }
  .seat__box { padding: 2px 4px; border-radius: 7px; }
  .seat__name { font-size: .64rem; }
  .seat__stack { font-size: .66rem; }
  .dealer { width: 15px; height: 15px; font-size: .54rem; line-height: 15px; right: -5px; top: -5px; }
  .bet { bottom: -15px; }
  .bet { font-size: .58rem; }
  /* ไพ่กลางก็ต้องเล็กลงตาม เพราะช่องว่างระหว่างที่นั่งซ้าย-ขวาแคบลงด้วย */
  .board .pc--md { width: min(40px, 8.6vw); font-size: min(6.5px, 1.4vw); }
}

/* ---------- แถบไพ่ในมือ + แง้มดู ---------- */
.hand-area {
  flex: 0 0 auto; position: relative;
  height: 132px;
  background: linear-gradient(#0d3a25, #08281a);
  border-top: 3px solid var(--rail-light);
  /* เรียงเป็นคอลัมน์ ข้อความอยู่แถวของมันเอง ไพ่อยู่แถวล่าง
     ของเดิมวางข้อความทับด้วย position:absolute แล้วไพ่ที่สูงกว่าแถบก็ขึ้นมานอนทับพอดี */
  display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
  padding-bottom: 4px;
  touch-action: none;
}
/* คำสั่งสอนวิธีดูไพ่ ต้องอ่านออกเสมอ เป็นกลไกหลักของเกม
   วางไว้เหนือแถบไพ่ ไม่ใช่ทับกันกับไพ่ ไม่งั้นบนจอเตี้ยจะเหลือแค่เศษตัวอักษรระหว่างไพ่ */
.hand-hint {
  flex: 0 0 auto; z-index: 3;
  text-align: center; font-size: .74rem; color: rgba(255,255,255,.6);
  margin-bottom: 3px;
  pointer-events: none;
}
@media (max-height: 700px) {
  .hand-area { height: 108px; }
  .hand-hint { font-size: .68rem; }
}
.hole { position: relative; display: flex; gap: 8px; }
.hole .pc {
  transition: transform .16s ease;
  transform-origin: bottom center;
  box-shadow: 0 6px 16px rgba(0,0,0,.5);
}
/* ปกติไพ่คว่ำและกดจมอยู่ พอแง้มถึงเงยขึ้นมาเป็นมุม */
/* ตอนแง้มต้องยกไพ่ให้พ้นปุ่มทอง ไม่งั้นปุ่มบังกลางไพ่ทั้งสองใบ
   ซึ่งเป็นจังหวะเดียวที่ต้องอ่านไพ่ให้ชัดที่สุด (นิ้วก็บังอีกชั้นอยู่แล้ว) */
.hole.is-peek .pc:nth-child(1) { transform: rotate(-11deg) translateY(-34px); }
.hole.is-peek .pc:nth-child(2) { transform: rotate(7deg) translateY(-34px); }
/* ตอนแง้ม นิ้วกดค้างอยู่บนปุ่มอยู่แล้ว ไม่ต้องเห็นปุ่มชัดอีก
   จึงหรี่ปุ่มลงและยุบลงไป เปิดทางให้อ่านไพ่ได้เต็มใบ
   (ยกไพ่สูงกว่านี้ไม่ได้ ไพ่จะโผล่ออกนอกแถบไพ่ในมือ) */
.peek-knob { transition: opacity .14s ease, transform .14s ease; }
.hand-area.is-peek .peek-knob {
  opacity: .16;
  transform: translateX(-50%) translateY(16px) scale(.8);
  pointer-events: auto;
}

.peek-knob {
  position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%);
  display: inline-flex; align-items: center; gap: 8px;
  padding: 9px 18px;
  font-size: .84rem; font-weight: 700; color: #06170f;
  background: linear-gradient(#f0cd72, var(--gold));
  border: 0; border-radius: 99px; cursor: grab;
  box-shadow: 0 3px 10px rgba(0,0,0,.45);
}
.peek-knob:active { cursor: grabbing; }
.peek-knob:focus-visible { outline: 2px solid var(--live); outline-offset: 3px; }
.peek-knob[disabled] { opacity: .35; }

/* ---------- แถบปุ่มลงมือ ---------- */
.actions {
  flex: 0 0 auto; padding: 9px 10px calc(9px + env(safe-area-inset-bottom));
  background: #082016; border-top: 1px solid #1d3a2b;
}
.act-row { display: flex; gap: 8px; }
.act {
  flex: 1 1 0; padding: 13px 8px;
  font-size: .95rem; font-weight: 700;
  color: var(--text); background: #1b3527;
  border: 1px solid #2f5540; border-radius: 10px; cursor: pointer;
}
.act:focus-visible { outline: 2px solid var(--live); outline-offset: 2px; }
.act[disabled] { opacity: .32; cursor: not-allowed; }
.act--fold  { background: #3a1d1a; border-color: #6b2f28; color: #ffb3ab; }
.act--call  { background: #1d4030; border-color: #2f6a4a; }
.act--raise { background: var(--gold); border-color: var(--gold); color: #06170f; }
.act small { display: block; font-family: var(--mono); font-size: .72rem; font-weight: 500; opacity: .85; }
/* ⚠️ ปุ่มที่กดไม่ได้ ห้ามหรี่ทั้งปุ่มด้วย opacity
   ปุ่มทอง (.act--raise) เป็นตัวหนังสือสีเกือบดำบนพื้นทอง พอหรี่ทั้งก้อนเหลือ 32%
   พื้นกับตัวหนังสือจางเข้าหาพื้นหลังพอๆ กัน contrast เหลือ 1.9:1 (อ่านออกต้องได้ 4.5:1)
   ที่เจอจริงตอนเล่น: จบมือแล้วปุ่ม "มือต่อไป" กลายเป็นแผ่นเปล่า มองไม่เห็นทั้งชื่อปุ่ม
   และไม่เห็นบรรทัดบอกเหตุผล คนเล่นจึงไม่รู้ว่าต้องเติมชิปก่อน = จบมือแล้วเล่นต่อไม่ได้
   จึงให้ปุ่มที่กดไม่ได้มีชุดสีของตัวเอง ที่ยังอ่านออกทั้งชื่อปุ่มและเหตุผล */
.act[disabled] {
  opacity: 1; cursor: not-allowed;
  background: #16301f; border-color: #2b4b37; color: #a9c8b6;
}
.act[disabled] small { opacity: 1; color: #93b3a0; }

/* แผงใส่จำนวนเงิน: วงกลม -/+ กับแป้นตัวเลข ใช้นิ้วง่ายกว่าแถบเลื่อน */
.bet-sheet {
  position: fixed; inset: 0; z-index: 70;
  background: rgba(3,12,8,.9);
  display: none; flex-direction: column; justify-content: flex-end;
}
.bet-sheet.is-on { display: flex; }
.bet-sheet__in {
  background: #0d2b1c; border-top: 2px solid var(--gold);
  border-radius: 16px 16px 0 0;
  padding: 14px 12px calc(12px + env(safe-area-inset-bottom));
}
.dial {
  display: flex; align-items: center; justify-content: center; gap: 14px;
  margin-bottom: 10px;
}
.dial__btn {
  flex: 0 0 auto; width: 52px; height: 52px;
  font-size: 1.7rem; font-weight: 700; line-height: 1;
  color: #06170f; background: linear-gradient(#f0cd72, var(--gold));
  border: 0; border-radius: 50%; cursor: pointer;
  box-shadow: 0 3px 8px rgba(0,0,0,.45);
}
.dial__btn:active { transform: translateY(1px); }
.dial__btn:focus-visible { outline: 2px solid var(--live); outline-offset: 3px; }
.dial__val {
  flex: 1 1 auto; max-width: 190px;
  background: #06170f; border: 2px solid var(--gold);
  border-radius: 14px; padding: 8px 10px; text-align: center;
}
.dial__lbl { font-size: .68rem; color: var(--muted); letter-spacing: .12em; }
.dial__num { font-family: var(--mono); font-size: 1.7rem; font-weight: 700; color: var(--gold); line-height: 1.1; }
.dial__hint { font-size: .68rem; color: var(--muted); }

.pad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 10px; }
.pad button {
  padding: 13px 0; font-family: var(--mono); font-size: 1.15rem; font-weight: 600;
  color: var(--text); background: #17342300; background-color: #1b3527;
  border: 1px solid #2f5540; border-radius: 9px; cursor: pointer;
}
.pad button:active { background-color: #234432; }
.pad button:focus-visible { outline: 2px solid var(--live); outline-offset: 2px; }
.pad .pad--ok { background-color: var(--gold); border-color: var(--gold); color: #06170f; font-weight: 700; grid-row: span 2; }
.pad .pad--cancel { background-color: #3a1d1a; border-color: #6b2f28; color: #ffb3ab; }

.waitbar { padding: 10px; text-align: center; }
.waitbar .msg { color: var(--muted); font-size: .88rem; margin-bottom: 8px; }

.log {
  flex: 0 0 auto; height: 24px; overflow: hidden;
  padding: 3px 12px; font-size: .74rem; color: var(--muted);
  background: #061a12; white-space: nowrap; text-overflow: ellipsis;
}
.toast {
  position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%);
  background: rgba(0,0,0,.85); color: #fff; padding: 9px 16px;
  border-radius: 99px; font-size: .85rem; z-index: 60;
  border: 1px solid rgba(255,255,255,.2);
  opacity: 0; pointer-events: none; transition: opacity .2s;
}
.toast.is-on { opacity: 1; }

/* ---------- ผลมือที่จบ ---------- */
/* วางไว้ล่างโต๊ะ ไม่ใช่กลางจอ ไม่งั้นไปบังไพ่กลางตอนเปิดไพ่พอดี */
.result {
  position: absolute; left: 50%; bottom: 6px; transform: translateX(-50%);
  width: min(92%, 400px); z-index: 40;
  background: rgba(6,22,15,.96); border: 1px solid var(--gold);
  border-radius: 14px; padding: 16px; text-align: center;
  box-shadow: 0 20px 50px rgba(0,0,0,.6);
  /* ⚠️ ประกาศ display ที่เดียวในบล็อกนี้เท่านั้น
     เคยประกาศ none แล้วประกาศ flex ทับทีหลัง ตัวหลังชนะ กล่องผลจึงไม่มีวันซ่อน
     ค้างทับโต๊ะตลอดมือถัดไป */
  display: none;
  /* แถวผลมีได้ถึง 9 แถว ต้องเลื่อนในกล่องตัวเอง ไม่ใช่ยืดขึ้นไปทับกองกลาง
     ต้องต่ำกว่าตัวเลขกองกลาง (อยู่ราว 47% ของโต๊ะ) เสมอ
     ตอนจบมือคือจังหวะที่ทุกคนอยากเช็คว่ากองเท่าไหร่ ใครได้เท่าไหร่ ห้ามบังกันเอง */
  max-height: 33%;
}
/* แถวผลเลื่อนในตัวเอง ส่วนหัวกับปุ่มอยู่กับที่ ไม่งั้นปุ่ม "เริ่มรอบเล่นใหม่"
   จะจมอยู่ใต้ขอบล่างของกล่อง โดยไม่มีอะไรบอกว่าเลื่อนได้ */
.result h3 { flex: 0 0 auto; }
.result .rows { flex: 1 1 auto; overflow-y: auto; min-height: 0; }
.result .foot { flex: 0 0 auto; padding-top: 8px; }
/* กล่อง "จบรอบเล่น" ต่างจากกล่องผลมือ: ตอนนั้นมือจบหมดแล้ว กองกลางเป็น 0 ไพ่กลางเป็นของเก่า
   จึงซ่อนไพ่กลางกับกองไปเลย แล้วให้ตารางอันดับใช้พื้นที่ได้เต็มที่
   ไม่งั้นเพดาน 33% (126px) เล็กกว่าหัว+ปุ่มที่ยืดไม่ได้ (140px) แถวอันดับจะถูกบีบเหลือ 0px
   = จบรอบเล่นแล้วไม่มีใครรู้ว่าใครชนะ ซึ่งเป็นเหตุผลเดียวของการตั้ง limit */
.table-area.is-over .center { display: none; }
#t-standings.is-on { max-height: 78%; }
#t-standings .rows { min-height: 64px; }
/* ต้องเป็น flex ไม่ใช่ block ไม่งั้น flex ของลูกไม่ทำงาน
   แถวอันดับจะยืดเต็มเนื้อหา แล้วดันปุ่ม "เริ่มรอบเล่นใหม่" ตกออกนอกจอ */
.result.is-on { display: flex; flex-direction: column; }
.result h3 { margin: 0 0 4px; font-size: 1.1rem; color: var(--gold); }
.result .row { display: flex; justify-content: space-between; gap: 10px; font-size: .85rem; padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,.08); }
.result .row b { font-family: var(--mono); color: var(--good); }
.result .hand-lbl { color: var(--muted); font-size: .78rem; }

/* ต้องปิด animation ด้วย ไม่ใช่แค่ transition
   ไม่งั้นไพ่ยังวิ่งอยู่ ทั้งที่เครื่องตั้งไว้ว่าขอให้ลดการเคลื่อนไหว */
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}

<!-- ============ เข้าห้อง ============ -->
<div class="join-wrap" id="join-screen">
  <div class="join">
    <h1>โป๊กเกอร์</h1>
    <p class="sub">Texas Hold'em · เล่นแยกเครื่องในวง WiFi เดียวกัน</p>

    <div class="fld">
      <label for="f-name">ชื่อของคุณ</label>
      <input id="f-name" type="text" maxlength="16" placeholder="พิมพ์ชื่อ" autocomplete="off">
    </div>

    <div class="tables" id="tables">
      <h2>โต๊ะที่เปิดอยู่ตอนนี้</h2>
      <div id="tables-list"></div>
    </div>

    <div class="fld">
      <label for="f-room">หรือพิมพ์รหัสห้องเอง (ตั้งใหม่ = เปิดโต๊ะใหม่)</label>
      <input id="f-room" type="text" maxlength="8" value="HOME" autocomplete="off">
    </div>

    <div class="fld">
      <label>ที่นั่ง</label>
      <div class="seatpick" id="seatpick"></div>
      <p class="hint-sm" id="seat-hint">ไม่เลือกก็ได้ ระบบจะหาที่ว่างให้เอง</p>
    </div>

    <div class="fld" id="fld-chips">
      <label for="f-chips">ชิปที่จะซื้อเข้าโต๊ะ — แต่ละคนไม่ต้องเท่ากัน</label>

    <div class="fld">
      <label for="f-limit">รอบเล่นนี้จบเมื่อไหร่</label>
      <div class="chips-row" id="limit-kind" style="margin:0 0 8px"></div>
      <input id="f-limit" type="number" min="1" step="1" value="20" style="display:none">
      <p class="hint-sm" id="limit-hint">เล่นไปเรื่อยๆ จนกดเลิกเอง</p>
    </div>

    <details style="margin:2px 0 14px">
      <summary style="cursor:pointer; color:var(--muted); font-size:.84rem">ตั้งค่าบอด (คนแรกที่เข้าห้องเป็นคนตั้ง)</summary>
      <div class="two" style="margin-top:10px">

          <input id="f-sb" type="number" min="1" step="1" value="10">

        <div class="fld" style="margin:0">
          <label for="f-bb">บอดใหญ่</label>
          <input id="f-bb" type="number" min="1" step="1" value="20">
        </div>
      </div>
    </details>

    <button class="btn-main" id="btn-join">นั่งโต๊ะ</button>
    <p class="err" id="join-err"></p>
    <a class="back" href="../../index.html">← กลับไปหน้ารวมเกม</a>
  </div>
</div>

<!-- ============ โต๊ะ ============ -->
<div id="game">
  <div class="topbar">
    <a href="../../index.html" id="btn-leave">← ออก</a>

      <div class="blinds" id="t-blinds">10 / 20</div>

  <div class="table-area" id="table-area">
    <div class="felt"></div>
    <div class="center">
      <span class="phase-tag" id="t-phase"></span>

<!-- แผงใส่จำนวนเงิน -->
<div class="bet-sheet" id="bet-sheet">
  <div class="bet-sheet__in">
    <div class="dial">
      <button class="dial__btn" id="bet-minus" aria-label="ลดจำนวน">−</button>
      <div class="dial__val">
        <div class="dial__lbl" id="bet-label">เดิมพันรวมเป็น</div>
        <div class="dial__num" id="bet-num">0</div>
        <div class="dial__hint" id="bet-hint"></div>
      </div>
      <button class="dial__btn" id="bet-plus" aria-label="เพิ่มจำนวน">+</button>

<script src="cards.js"></script>
<script>
(function () {
  "use strict";

  var $ = function (id) { return document.getElementById(id); };

  var ws = null;
  var mySeat = -1;
  var view = null;
  var roomCode = "HOME";
  var peeking = false;

  /* ---------- แจ้งเตือนสั้นๆ ---------- */
  var toastTimer = null;
  function toast(msg) {
    var t = $("toast");
    t.textContent = msg;
    t.classList.add("is-on");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove("is-on"); }, 2200);
  }

  /* ---------- หน้าเข้าห้อง ---------- */

  /* ตัวเลือกว่ารอบเล่นนี้จะจบเมื่อไหร่ */
  var limitType = "none", limitValue = 20;
  (function buildLimit() {
    var host = $("limit-kind");
    var opts = [
      { k: "none",    label: "ไม่จำกัด", hint: "เล่นไปเรื่อยๆ จนกดเลิกเอง" },
      { k: "hands",   label: "ครบกี่ตา", hint: "ครบจำนวนตาแล้วนับคะแนนทันที" },
      { k: "minutes", label: "ครบกี่นาที", hint: "หมดเวลาแล้วเล่นตาที่ค้างให้จบก่อน แล้วค่อยนับคะแนน" }
    ];
    opts.forEach(function (o) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "qbtn" + (o.k === "none" ? " is-on" : "");
      b.textContent = o.label;
      b.addEventListener("click", function () {
        limitType = o.k;
        Array.prototype.forEach.call(host.children, function (c) { c.classList.remove("is-on"); });
        b.classList.add("is-on");
        $("f-limit").style.display = o.k === "none" ? "none" : "block";
        $("f-limit").value = o.k === "minutes" ? 30 : 20;
        $("limit-hint").textContent = o.hint;
      });
      host.appendChild(b);
    });
  })();

  var PRESETS = [500, 1000, 2000, 5000, 10000];
  (function buildPresets() {
    var host = $("chip-presets");
    PRESETS.forEach(function (v) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "qbtn";
      b.textContent = v.toLocaleString("th-TH");
      b.addEventListener("click", function () { $("f-chips").value = v; });
      host.appendChild(b);
    });
  })();

  /* จำค่าที่กรอกไว้ครั้งก่อน */
  try {
    var saved = JSON.parse(localStorage.getItem("bg.poker.v1") || "{}");
    if (saved.name) $("f-name").value = saved.name;
    if (saved.room) $("f-room").value = saved.room;
    if (saved.chips) $("f-chips").value = saved.chips;
  } catch (e) { /* โหมดส่วนตัว ไม่เป็นไร */ }

  if (location.hash.length > 1) $("f-room").value = decodeURIComponent(location.hash.slice(1)).toUpperCase();

  /* ---------- รายการโต๊ะที่เปิดอยู่ ---------- */

  var lobbyWs = null;
  var lobbyWanted = false, lobbyRetry = 0, lobbyTimer = null;

  /* รหัสประจำเครื่อง ใช้พิสูจน์ว่าเป็นเจ้าของที่นั่งเดิมจริงตอนกลับเข้ามา
     ชื่ออย่างเดียวใช้ไม่ได้ เพราะคนอื่นก็เห็นชื่อเราในหน้ารวมโต๊ะ */
  function myToken() {
    var k = "bg.poker.token.v1", t = "";
    try { t = localStorage.getItem(k) || ""; } catch (e) {}
    if (!t) {
      t = "t" + Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2);
      try { localStorage.setItem(k, t); } catch (e) {}
    }
    return t;
  }

  function myName() {
    try { return (JSON.parse(localStorage.getItem("bg.poker.v1") || "{}").name || ""); }
    catch (e) { return ""; }
  }

  var lastTablesSig = null;

  function paintTables(rooms) {
    var host = $("tables-list");

    /* วาดใหม่เฉพาะตอนข้อมูลเปลี่ยนจริง
       ของเดิมสร้างปุ่มใหม่ทั้งแถบทุกครั้งที่มีคนลงมือในโต๊ะไหนก็ตาม (~ทุก 1.2 วิ)
       ปุ่มที่กำลังจะถูกกดเลยหายไปกลางคัน กดยังไงก็ไม่ติด */
    var sig = JSON.stringify((rooms || []).map(function (r) {
      return [r.code, r.online, r.full, r.phase, r.handNo, r.blinds, r.limit,
              (r.names || []).join(","), (r.away || []).join(","),
              (r.seats || []).map(function (x) { return x ? x.name + ":" + (x.connected ? 1 : 0) : ""; }).join("|")];
    }));
    if (sig === lastTablesSig && host.childNodes.length) return;
    lastTablesSig = sig;

    host.innerHTML = "";

    if (!rooms || !rooms.length) {
      var none = document.createElement("div");
      none.className = "none";
      none.textContent = "ยังไม่มีใครเปิดโต๊ะ คุณเป็นคนแรกได้เลย";
      host.appendChild(none);
      return;
    }

    rooms.forEach(function (r) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "tbl" + ($("f-room").value.toUpperCase() === r.code ? " is-on" : "");

      var code = document.createElement("span");
      code.className = "tbl__code";
      code.textContent = r.code;
      b.appendChild(code);

      var meta = document.createElement("span");
      meta.className = "tbl__meta";
      var who = document.createElement("span");
      who.className = "tbl__who";
      var bits = [r.blinds];
      if (r.limit) bits.push(r.limit);
      bits.push(r.phase === "waiting" ? "รอเริ่ม" : "มือที่ " + r.handNo);
      who.textContent = bits.join(" · ") + (r.names.length ? " — " + r.names.join(", ") : "");
      meta.appendChild(who);
      b.appendChild(meta);

      var n = document.createElement("span");
      n.className = "tbl__n" + (r.online ? " tbl__live" : "");
      n.textContent = r.full ? "เต็ม" : r.online + "/9";
      b.appendChild(n);

      b.addEventListener("click", function () {
        $("f-room").value = r.code;
        /* เติมชื่อให้เฉพาะเมื่อเป็นชื่อของเครื่องนี้เอง
           ของเดิมเติมชื่อใครก็ได้ที่หลุดไป คนกดต่อโดยไม่ทันดูก็สวมสิทธิ์เขาไปเลย */
        var mine = myName();
        if (mine && r.away && r.away.indexOf(mine) !== -1 && !$("f-name").value.trim()) {
          $("f-name").value = mine;
        }
        paintTables(window.__rooms || []);
        paintSeatPicker();
        $("f-name").focus();
      });

      host.appendChild(b);
    });
  }

  /* ---------- เลือกที่นั่ง ---------- */

  var wantSeat = null;   /* null = ที่ไหนก็ได้ */
  var rejoinSeat = -1;   /* ที่นั่งของคนชื่อเดียวกันที่หลุดอยู่ ใช้ถามยืนยันตอนกดนั่งโต๊ะ */

  function currentRoom() {
    var code = ($("f-room").value || "").toUpperCase();
    return (window.__rooms || []).filter(function (r) { return r.code === code; })[0] || null;
  }

  function paintSeatPicker() {
    var host = $("seatpick");
    host.innerHTML = "";
    var room = currentRoom();
    var seats = room ? room.seats : new Array(9).fill(null);

    /* ที่นั่งที่เลือกไว้ดันมีคนมานั่งแล้ว ให้ล้างค่า */
    if (wantSeat !== null && seats[wantSeat] && seats[wantSeat].connected) wantSeat = null;

    var any = document.createElement("button");
    any.type = "button";
    any.className = "sp" + (wantSeat === null ? " is-on" : "");
    any.innerHTML = "ที่ไหนก็ได้";
    any.addEventListener("click", function () { wantSeat = null; paintSeatPicker(); });
    host.appendChild(any);

    for (var i = 0; i < 9; i++) {
      (function (idx) {
        var s = seats[idx];
        var b = document.createElement("button");
        b.type = "button";
        var cls = "sp";
        if (s && s.connected) cls += " is-taken";
        else if (s && !s.connected) cls += " is-away";
        if (wantSeat === idx) cls += " is-on";
        b.className = cls;

        if (s) {
          b.innerHTML = (idx + 1) + "<small>" + s.name + (s.connected ? "" : " (หลุด)") + "</small>";
        } else {
          b.innerHTML = (idx + 1) + "<small>ว่าง</small>";
        }

        if (s && s.connected) {
          b.disabled = true;
        } else {
          b.addEventListener("click", function () {
            /* กดที่นั่งของคนที่หลุด = สวมสิทธิ์เขา ต้องยืนยันก่อน
               ไม่งั้นใครก็เดินมานั่งทับชิปเพื่อนได้ */
            if (s && !s.connected) {
              if (!confirm("ที่นั่งนี้เป็นของ " + s.name + " ที่หลุดไป · " +
                           "กดตกลงถ้าคุณคือ " + s.name + " จะได้ชิปเดิมคืน")) return;
              $("f-name").value = s.name;
            }
            wantSeat = idx;
            paintSeatPicker();
          });
        }
        host.appendChild(b);
      })(i);
    }

    refreshBuyIn();

    var room2 = currentRoom();
    $("seat-hint").textContent = room2
      ? "โต๊ะ " + room2.code + " · เลือกช่องว่างได้ ช่องที่ขึ้นว่าหลุดคือกลับเข้าที่เดิมพร้อมชิปเดิม"
      : "โต๊ะใหม่ยังไม่มีใครนั่ง เลือกช่องไหนก็ได้";
  }

  /* กลับเข้าที่เดิม เซิร์ฟเวอร์คืนชิปเดิมให้ ไม่ได้ใช้ตัวเลขในช่องนี้
     ถ้ายังโชว์ช่องไว้ คนจะเข้าใจว่าจะได้ชิปตามที่พิมพ์ */
  function refreshBuyIn() {
    var room = currentRoom();
    var name = ($("f-name").value || "").trim();
    var back = false, backSeat = -1;
    if (room && name && room.seats) {
      for (var i = 0; i < room.seats.length; i++) {
        var s = room.seats[i];
        if (s && !s.connected && s.name === name) { back = true; backSeat = i; break; }
      }
    }
    /* ห้ามเลือกที่นั่งให้เงียบๆ ตรงนี้
       ตัวกลางยอมให้ "เจาะจงที่นั่ง" ผ่าน เพราะเชื่อว่าหน้าเว็บถามยืนยันตัวตนไปแล้ว
       ถ้าเราเลือกให้เองโดยไม่ถาม ข้อสมมตินั้นก็ไม่จริง ใครพิมพ์ชื่อคนที่หลุดก็ได้ชิปไปเลย
       จึงเก็บไว้ไปถามตอนกด "นั่งโต๊ะ" แทน */
    rejoinSeat = back ? backSeat : -1;
    $("fld-chips").style.display = back ? "none" : "";
    $("rejoin-note").style.display = back ? "" : "none";
    $("rejoin-note").textContent = back
      ? "กลับเข้าที่เดิมของ " + name + " (ช่องที่ " + (backSeat + 1) + ") · ได้ชิปเดิมที่ค้างไว้คืน ไม่ต้องซื้อใหม่"
      : "";
  }

  $("f-room").addEventListener("input", function () { paintSeatPicker(); paintTables(window.__rooms || []); });
  $("f-name").addEventListener("input", refreshBuyIn);

  function openLobby() {
    lobbyWanted = true;
    var proto = location.protocol === "https:" ? "wss://" : "ws://";
    try { lobbyWs = new WebSocket(proto + location.host); } catch (e) { return; }

    lobbyWs.onopen = function () { lobbyRetry = 0; lobbyWs.send(JSON.stringify({ type: "lobby" })); };
    lobbyWs.onmessage = function (ev) {
      var msg;
      try { msg = JSON.parse(ev.data); } catch (e) { return; }
      if (msg.type === "rooms") { window.__rooms = msg.rooms; paintTables(msg.rooms); paintSeatPicker(); }
    };
    lobbyWs.onerror = function () { $("tables-list").innerHTML = ""; $("join-err").innerHTML = hostedHint(); };
    lobbyWs.onclose = function () {
      lobbyWs = null;
      if (!lobbyWanted) return;
      /* ต้องต่อใหม่เอง ไม่งั้นรายชื่อโต๊ะจะค้างอยู่แบบเก่าโดยไม่มีอะไรบอกว่าตายแล้ว
         แล้วคนจะเลือกโต๊ะที่ไม่มีอยู่จริง */
      window.__rooms = [];
      $("tables-list").innerHTML =
        "<p class='hint-sm' style='opacity:.65;margin:0'>กำลังต่อใหม่...</p>";
      lobbyRetry = Math.min(lobbyRetry + 1, 6);
      lobbyTimer = setTimeout(openLobby, 500 * lobbyRetry);
    };
  }

  function closeLobby() {
    lobbyWanted = false;
    if (lobbyTimer) { clearTimeout(lobbyTimer); lobbyTimer = null; }
    if (lobbyWs) { try { lobbyWs.close(); } catch (e) {} lobbyWs = null; }
  }

  openLobby();
  paintSeatPicker();

  $("btn-join").addEventListener("click", join);

  /* ออกจากโต๊ะกลางมือ = หมอบและเสียเงินในกอง ต้องถามก่อน */
  function leaveTable() {
    /* ต้องบอกตัวกลางว่าลุกจริง แล้วปิดโซเก็ตด้วย
       ถ้าแค่เปลี่ยนหน้า เบราว์เซอร์อาจพักแท็บไว้ใน bfcache ทั้งโซเก็ต
       ตัวกลางจะยังนับว่าเรานั่งอยู่ แล้วคนที่เหลือรอตาเราตลอดกาล */
    try { if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: "leave" })); } catch (e) {}
    try { if (ws) ws.close(); } catch (e) {}
    ws = null;
  }

  /* ปิดแท็บ / ย้อนกลับ / รีโหลด: ปิดโซเก็ตอย่างเดียวพอ ห้ามส่ง leave
     เพราะ leave = ปล่อยที่นั่งทิ้ง ชิปที่ชนะมาจะหายกลายเป็นค่าในช่องซื้อชิป
     แค่ปิดโซเก็ตก็พอให้ตัวกลางรู้ว่าหลุด (ที่นั่งกับชิปยังอยู่ให้กลับเข้ามาได้)
     ส่วนโต๊ะก็ไม่ค้าง เพราะคนที่หลุดถูกหมอบให้อัตโนมัติอยู่แล้ว */
  window.addEventListener("pagehide", function () {
    try { if (ws) ws.close(); } catch (e) {}
  });

  /* เปิด/ปิดแผงสรุปโต๊ะ */
  $("btn-table").addEventListener("click", function () {
    tablePanelOn = !tablePanelOn;
    paintTablePanel();
  });

  $("btn-leave").addEventListener("click", function (e) {
    if (view && view.phase !== "waiting" && view.phase !== "showdown") {
      if (!confirm("ยังเล่นมือนี้อยู่ ออกตอนนี้จะถือว่าหมอบและเสียเงินในกอง ออกเลยไหม")) {
        e.preventDefault();
        return;
      }
    }
    leaveTable();
  });
  $("f-name").addEventListener("keydown", function (e) { if (e.key === "Enter") join(); });

  function join() {
    var name = $("f-name").value.trim();
    var room = ($("f-room").value.trim() || "HOME").toUpperCase();
    var chips = Math.floor(Number($("f-chips").value));

    if (!name) { $("join-err").textContent = "ใส่ชื่อก่อน"; $("f-name").focus(); return; }
    if (!isFinite(chips) || chips <= 0) { $("join-err").textContent = "ใส่จำนวนชิปที่จะซื้อ"; return; }

    try {
      localStorage.setItem("bg.poker.v1", JSON.stringify({ name: name, room: room, chips: chips }));
    } catch (e) { /* ข้ามไป */ }

    /* จะไปนั่งที่ของคนที่หลุดซึ่งมีชิปค้างอยู่ ต้องยืนยันตัวตนก่อนเสมอ */
    var seatWanted = wantSeat;
    if (seatWanted === null && rejoinSeat >= 0) {
      if (!confirm("ที่นั่งช่องที่ " + (rejoinSeat + 1) + " เป็นของ " + name + " ที่หลุดไป · " +
                   "กดตกลงถ้าคุณคือ " + name + " จะได้ชิปเดิมคืน")) return;
      seatWanted = rejoinSeat;
    }

    roomCode = room;
    $("join-err").textContent = "กำลังต่อ...";
    $("btn-join").disabled = true;
    closeLobby();

    var proto = location.protocol === "https:" ? "wss://" : "ws://";
    ws = new WebSocket(proto + location.host);

    ws.onopen = function () {
      ws.send(JSON.stringify({
        type: "join", room: room, name: name, buyIn: chips, token: myToken(),
        seatId: seatWanted === null ? undefined : seatWanted
      }));
      /* คนแรกที่เข้าเป็นคนตั้งบอด ถ้าโต๊ะยังว่าง ฝั่งเซิร์ฟเวอร์จะรับไว้ */
      /* ตั้งค่าโต๊ะเฉพาะตอนเปิดโต๊ะใหม่เท่านั้น
         ไม่งั้นคนที่เข้าทีหลังจะลบบอดกับเวลาที่เจ้าภาพตั้งไว้ทิ้งเงียบๆ */
      var known = (window.__rooms || []).filter(function (r) { return r.code === room; })[0];
      if (!known) {
        ws.send(JSON.stringify({
          type: "config",
          smallBlind: Math.floor(Number($("f-sb").value)) || 10,
          bigBlind: Math.floor(Number($("f-bb").value)) || 20,
          limitType: limitType,
          limitValue: Math.floor(Number($("f-limit").value)) || 20
        }));
      }
    };

    ws.onmessage = function (ev) {
      var msg;
      try { msg = JSON.parse(ev.data); } catch (e) { return; }

      if (msg.type === "joined") {
        mySeat = msg.seatId;
        $("join-screen").style.display = "none";
        $("game").classList.add("is-on");
        $("t-hand").textContent = "ห้อง " + msg.room;
        location.hash = msg.room;
      } else if (msg.type === "state") {
        view = msg.state;
        render();
      } else if (msg.type === "error") {
        toast(msg.message);
        $("join-err").textContent = msg.message;
        $("btn-join").disabled = false;
      }
    };

    ws.onclose = function () {
      $("btn-join").disabled = false;
      if ($("game").classList.contains("is-on")) toast("หลุดจากโต๊ะ ลองเปิดหน้านี้ใหม่");
      else $("join-err").innerHTML = hostedHint();
    };

    ws.onerror = function () {
      $("join-err").innerHTML = hostedHint();
      $("btn-join").disabled = false;
    };
  }

  /* โป๊กเกอร์ต้องมีตัวกลาง เปิดจาก GitHub Pages เฉยๆ จะต่อไม่ได้
     บอกวิธีให้ชัดแทนที่จะขึ้นว่า error เฉยๆ */
  function hostedHint() {
    if (location.protocol === "file:" || /github\.io$/.test(location.hostname)) {
      return "เกมนี้ต้องรันตัวกลางก่อน เปิดหน้านี้จากลิงก์ GitHub เฉยๆ เล่นไม่ได้<br>" +
             "บนเครื่องเจ้าภาพ สั่ง <code>node lan/server.mjs</code> " +
             "แล้วทุกคนเปิดที่ <code>http://ไอพีเครื่องนั้น:8080</code>";
    }
    return "ต่อตัวกลางไม่ได้ ตรวจว่ารัน node lan/server.mjs อยู่ไหม";
  }

  function send(obj) {
    if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj));
  }

  /* ---------- แง้มดูไพ่ ---------- */

  function setPeek(on) {
    peeking = on;
    var hole = $("t-hole");
    hole.classList.toggle("is-peek", on);
    /* ใส่ที่แถบไพ่ด้วย เพราะปุ่มทองเป็นพี่น้องกับ .hole ไม่ใช่ลูก
       CSS จะได้หรี่ปุ่มตอนแง้มได้ */
    hole.parentNode.classList.toggle("is-peek", on);
    paintHole();
  }

  var knob = $("btn-peek");
  ["pointerdown"].forEach(function (e) {
    knob.addEventListener(e, function (ev) { ev.preventDefault(); setPeek(true); });
  });
  ["pointerup", "pointercancel", "pointerleave"].forEach(function (e) {
    knob.addEventListener(e, function () { setPeek(false); });
  });
  /* คีย์บอร์ด: กดค้าง Space/Enter ก็แง้มได้ */
  knob.addEventListener("keydown", function (e) {
    if (e.key === " " || e.key === "Enter") { e.preventDefault(); setPeek(true); }
  });
  knob.addEventListener("keyup", function () { setPeek(false); });
  window.addEventListener("blur", function () { setPeek(false); });

  function paintHole() {
    var host = $("t-hole");
    if (!view || mySeat < 0) { host.innerHTML = ""; lastHoleSig = ""; return; }
    var me = view.seats[mySeat];
    if (!me || !me.cards.length) {
      host.innerHTML = "";
      lastHoleSig = "";
      $("hand-hint").textContent = view.phase === "waiting"
        ? "รอเริ่มมือใหม่" : "รอบนี้คุณไม่ได้ร่วมมือ";
      knob.disabled = true;
      return;
    }
    knob.disabled = false;
    $("hand-hint").textContent = peeking ? "" : "กดค้างที่ปุ่มทองเพื่อแง้มดูไพ่";

    /* ตอนเปิดไพ่แล้ว ไม่ต้องกดค้างอีก ทุกคนเห็นหมดแล้ว */
    var reveal = peeking || (view.lastResult && view.lastResult.showdown);
    /* ⚠️ ห้ามวาดไพ่ใหม่ทุกครั้งที่ state เข้ามา
       ตอนเริ่มมือ เซิร์ฟเวอร์ยิง state ติดกันหลายรอบ (แจกไพ่ · ลงบอด · ถึงตาใคร)
       ถ้าวาดใหม่ทุกรอบ แอนิเมชันที่เพิ่งเริ่มจะถูกลบทิ้งกลางคัน = ไม่เห็นอะไรเลย
       จึงวาดใหม่เฉพาะตอนเนื้อหาเปลี่ยนจริง แล้ววิ่งเฉพาะตอนขึ้นมือใหม่ */
    var sig = view.handNo + "|" + (reveal ? "open" : "back") + "|" + me.cards.join(",");
    if (sig === lastHoleSig) return;
    var freshHole = view.handNo !== lastHoleHand;
    lastHoleSig = sig;
    lastHoleHand = view.handNo;
    host.innerHTML = "";
    me.cards.forEach(function (c, i) {
      var el = window.Cards.make(reveal ? c : "??", "lg");
      if (freshHole) {
        el.classList.add("is-dealt");
        el.style.animationDelay = (i * 110) + "ms";
      } else if (justRevealed && reveal) {
        el.classList.add("is-flip");
        el.style.animationDelay = (i * 120) + "ms";
      }
      host.appendChild(el);
    });
  }

  /* ---------- วางที่นั่งรอบโต๊ะ ---------- */

  /* ตำแหน่ง 9 ที่นั่งรอบวงรี เป็นเปอร์เซ็นต์ของพื้นที่โต๊ะ
     ที่นั่งของเราจะถูกหมุนให้มาอยู่ล่างสุดเสมอ */
  /* ที่นั่งข้างโต๊ะต้องไม่ตรงแถวเดียวกับไพ่กลาง (ไพ่กลางอยู่ราว 40-52%)
     และตัวเราต้องไม่ล้นลงไปทับแถบข้อความล่าง */
  /* ที่นั่งข้างโต๊ะต้องห่างกันพอ และไม่ล้ำแถวไพ่กลาง (ราว 40-56%) */
  var SPOTS = [
    [50, 90],                      /* ตัวเราอยู่ล่างสุดเสมอ */
    [17, 78], [11, 54], [17, 26], [38, 11],
    [62, 11], [83, 26], [89, 54], [83, 78]
  ];

  function seatOrder() {
    /* เรียงที่นั่งจริงให้ตัวเราอยู่ช่องแรก (ล่างสุด) */
    var n = view.seats.length, out = [];
    var base = mySeat >= 0 ? mySeat : 0;
    for (var i = 0; i < n; i++) out.push((base + i) % n);
    return out;
  }

  /* จำสภาพรอบก่อน ใช้ตัดสินว่า "ใบไหนเพิ่งลงมาใหม่" จะได้วิ่งเฉพาะใบนั้น */
  var lastBoardLen = 0, lastBoardHand = -1, lastHoleHand = -1, lastPot = 0;
  var lastBoardSig = "", lastHoleSig = "", lastRevealHand = -1, justRevealed = false;

  function render() {
    if (!view) return;

    /* เพิ่งเปิดไพ่ในมือนี้หรือเปล่า ใช้สั่งให้พลิกไพ่ครั้งเดียว
       ตั้งไว้ตรงนี้ก่อน paint ทุกตัว แล้วล้างทิ้งท้าย render */
    justRevealed = !!(view.lastResult && view.lastResult.showdown) &&
                   view.handNo !== lastRevealHand;
    if (justRevealed) lastRevealHand = view.handNo;

    $("t-blinds").textContent = view.blinds.sb + " / " + view.blinds.bb;
    var me = view.seats[mySeat];
    $("t-me").textContent = me ? me.stack.toLocaleString("th-TH") + " ชิป" : "—";

    var PHASE = {
      waiting: "รอเริ่ม", preflop: "พรีฟลอป", flop: "ฟลอป",
      turn: "เทิร์น", river: "ริเวอร์", showdown: "เปิดไพ่"
    };
    $("t-phase").textContent = PHASE[view.phase] || "";
    var potEl = $("t-pot");
    potEl.textContent = "กองกลาง " + view.pot.toLocaleString("th-TH");
    /* กองโตขึ้น = มีคนลงเงิน ให้ตัวเลขเด้งบอกหน่อย จะได้รู้สึกว่ามีอะไรเกิดขึ้น */
    if (view.pot > lastPot) {
      potEl.classList.remove("is-bump");
      void potEl.offsetWidth;   /* บังคับให้คิดใหม่ ไม่งั้นแอนิเมชันไม่เริ่มรอบสอง */
      potEl.classList.add("is-bump");
    }
    lastPot = view.pot;
    $("t-hand").textContent = "ห้อง " + roomCode + (view.handNo ? " · มือที่ " + view.handNo : "");
    $("t-log").textContent = (view.log && view.log.length) ? view.log[view.log.length - 1] : "";

    /* ไพ่กลาง 5 ช่อง — ใบที่เพิ่งเปิดใหม่เท่านั้นที่วิ่งลงมา
       ขึ้นมือใหม่ให้ถือว่าใหม่ทั้งแถว (ฟลอปลงพร้อมกัน 3 ใบ) */
    var board = $("t-board");
    var bsig = view.handNo + "|" + view.board.join(",");
    if (bsig !== lastBoardSig) {
      var freshFrom = (view.handNo !== lastBoardHand) ? 0 : lastBoardLen;
      lastBoardSig = bsig;
      lastBoardLen = view.board.length;
      lastBoardHand = view.handNo;
      board.innerHTML = "";
      for (var i = 0; i < 5; i++) {
        var cel;
        if (view.board[i]) {
          cel = window.Cards.make(view.board[i], "md");
          if (i >= freshFrom) {
            cel.classList.add("is-dealt");
            cel.style.animationDelay = ((i - freshFrom) * 90) + "ms";
          }
        } else {
          cel = window.Cards.slot("md");
        }
        board.appendChild(cel);
      }
    }

    /* ปิดแผงใส่เงินอัตโนมัติ เฉพาะตอนที่มันเป็นแผง "เดิมพัน" และตาเราผ่านไปแล้ว
       ⚠️ ห้ามปิดแผง "เติมชิป" (betOnConfirm ไม่ว่าง)
       ตอนจบมือ view.current ไม่ใช่เราอยู่แล้วเสมอ ถ้าปิดด้วยเงื่อนไขเดียวกัน
       แผงเติมชิปจะถูกปิดทิ้งทุกครั้งที่ state เข้ามา คนที่ชิปหมดกดยืนยันไม่ทัน
       จึงเติมชิปไม่สำเร็จสักที และโต๊ะก็ไม่มีวันครบ 2 คนที่มีชิป = จบมือแล้วเล่นต่อไม่ได้ */
    if (!betOnConfirm && view.current !== mySeat) $("bet-sheet").classList.remove("is-on");

    paintLimit();
    paintSeats();
    paintHole();
    paintActions();
    paintResult();
    paintStandings();
    paintTablePanel();
    justRevealed = false;
  }

  /* ---------- แผงสรุปโต๊ะ: ใครนั่งตรงไหน ซื้อเข้าเท่าไหร่ ตอนนี้ได้เสียเท่าไหร่ ----------
     รวมสองเรื่องไว้แผงเดียว เพราะมันคือคำถามเดียวกันของคนเล่นตอนมองไปรอบโต๊ะ
     และช่องว่างในตารางนี้ก็เป็นปุ่มย้ายไปนั่งได้เลย ไม่ต้องมีหน้าจอแยกอีกอัน */
  var tablePanelOn = false;

  function paintTablePanel() {
    var box = $("t-table");
    if (!tablePanelOn || !view) { box.classList.remove("is-on"); box.innerHTML = ""; return; }
    box.innerHTML = "";

    var h = document.createElement("h3");
    h.textContent = "โต๊ะ · เงิน";
    box.appendChild(h);

    var head = document.createElement("div");
    head.className = "mhead";
    head.innerHTML = "<span>ที่นั่ง</span><span>ซื้อเข้า → ชิปตอนนี้</span><span>ได้ / เสีย</span>";
    box.appendChild(head);

    var rows = document.createElement("div");
    rows.className = "rows";
    /* ย้ายที่นั่งกลางมือไม่ได้ ลำดับการเดินตาผูกกับเลขช่อง */
    var canMove = view.phase === "waiting" || view.phase === "showdown";
    var totalBuy = 0, totalStacks = 0;

    for (var i = 0; i < view.seats.length; i++) {
      (function (idx) {
        var st2 = view.seats[idx];
        var row = document.createElement("div");
        row.className = "mrow" + (st2 ? "" : " mrow--free");

        var nm = document.createElement("span");
        nm.className = "nm";
        nm.textContent = (idx + 1) + " · " +
          (st2 ? st2.name + (idx === mySeat ? " (คุณ)" : "") : "ว่าง");
        row.appendChild(nm);

        if (st2) {
          totalBuy += st2.boughtIn;
          totalStacks += st2.stack;
          var mid = document.createElement("span");
          mid.className = "num buy";
          mid.textContent = st2.boughtIn.toLocaleString("th-TH") + " → " +
                            st2.stack.toLocaleString("th-TH");
          row.appendChild(mid);

          var net = document.createElement("b");
          net.className = "num";
          net.textContent = (st2.net >= 0 ? "+" : "") + st2.net.toLocaleString("th-TH");
          net.style.color = st2.net > 0 ? "var(--good)"
                          : (st2.net < 0 ? "#ff8f84" : "var(--muted)");
          row.appendChild(net);
        } else {
          row.appendChild(document.createElement("span"));
          var mv = document.createElement("button");
          mv.type = "button";
          mv.className = "mseat";
          mv.textContent = "มานั่งตรงนี้";
          mv.disabled = !canMove || idx === mySeat;
          mv.addEventListener("click", function () {
            send({ type: "moveseat", seatId: idx });
            tablePanelOn = false;
            paintTablePanel();
          });
          row.appendChild(mv);
        }
        rows.appendChild(row);
      })(i);
    }
    box.appendChild(rows);

    var foot = document.createElement("div");
    foot.className = "foot";
    var sum = document.createElement("p");
    sum.className = "hint-sm";
    sum.style.margin = "0 0 8px";
    /* ชิปที่ลงกองไปแล้วยังเป็นของโต๊ะ ต้องนับรวม ไม่งั้นกลางมือยอดจะดูเหมือนหาย */
    sum.textContent = "ซื้อเข้ารวม " + totalBuy.toLocaleString("th-TH") +
                      " · ชิปบนโต๊ะรวม " + (totalStacks + view.pot).toLocaleString("th-TH") +
                      (canMove ? "" : " · ย้ายที่นั่งได้ตอนจบมือ");
    foot.appendChild(sum);
    var close = document.createElement("button");
    close.type = "button";
    close.className = "btn-main";
    close.textContent = "ปิด";
    close.addEventListener("click", function () { tablePanelOn = false; paintTablePanel(); });
    foot.appendChild(close);
    box.appendChild(foot);

    box.classList.add("is-on");
  }

  function paintSeats() {
    if (!view) return;
    var area = $("table-area");
    /* ลบที่นั่งเดิมออกก่อน (เก็บ felt / center / result ไว้) */
    Array.prototype.slice.call(area.querySelectorAll(".seat")).forEach(function (n) { n.remove(); });

    var order = seatOrder();
    order.forEach(function (seatId, slotIdx) {
      var s = view.seats[seatId];
      if (!s) return;

      var spot = SPOTS[slotIdx % SPOTS.length];
      var el = document.createElement("div");
      el.className = "seat"
        + (seatId === view.current ? " is-turn" : "")
        + (s.folded ? " is-folded" : "")
        + (seatId === mySeat ? " is-me" : "");
      el.style.left = spot[0] + "%";
      el.style.top = spot[1] + "%";

      /* ไพ่คว่ำเล็กๆ ข้างชื่อ */
      var cards = document.createElement("div");
      cards.className = "seat__cards";
      if (s.cards.length && !s.folded) {
        s.cards.forEach(function (c, ci) {
          /* ไพ่ตัวเองบนโต๊ะคว่ำตลอด ดูได้จากแถบล่างที่บังมือเท่านั้น
             ถ้าผูกกับ peeking ไพ่จะค้างหงายกลางจอหลังปล่อยปุ่ม */
          var faceUp = (view.lastResult && view.lastResult.showdown && !s.folded);
          var cel = window.Cards.make(
            (seatId === mySeat && !faceUp) ? "??" : (faceUp ? c : "??"), "sm");
          /* ไพ่รอบโต๊ะพลิกไล่กันไป ทีละที่นั่ง ทีละใบ ให้เห็นว่าใครถืออะไร */
          if (justRevealed && faceUp) {
            cel.classList.add("is-flip");
            cel.style.animationDelay = (seatId * 70 + ci * 110) + "ms";
          }
          cards.appendChild(cel);
        });
      }
      el.appendChild(cards);

      var box = document.createElement("div");
      box.className = "seat__box";

      var nm = document.createElement("div");
      nm.className = "seat__name";
      nm.textContent = s.name;
      box.appendChild(nm);

      var stk = document.createElement("div");
      stk.className = "seat__stack";
      stk.textContent = s.stack.toLocaleString("th-TH");
      box.appendChild(stk);

      if (!s.connected) {
        var off = document.createElement("div");
        off.className = "seat__off";
        off.textContent = "หลุด";
        box.appendChild(off);
      } else if (s.sitOut) {
        var so = document.createElement("div");
        so.className = "seat__off";
        so.textContent = "พักมือ";
        box.appendChild(so);
      } else if (s.lastAction) {
        var la = document.createElement("div");
        la.className = "seat__act";
        la.textContent = s.lastAction;
        box.appendChild(la);
      }

      if (seatId === view.button) {
        var d = document.createElement("span");
        d.className = "dealer";
        d.textContent = "D";
        box.appendChild(d);
      }

      box.style.position = "relative";
      el.appendChild(box);

      if (s.bet > 0) {
        var b = document.createElement("span");
        b.className = "bet";
        b.textContent = s.bet.toLocaleString("th-TH");
        el.appendChild(b);
      }

      area.appendChild(el);
    });
  }

  /* ---------- ปุ่มลงมือ ---------- */

  function paintActions() {
    var row = $("act-row");
    row.innerHTML = "";

    var me = view.seats[mySeat];
    if (!me) return;

    /* ยังไม่เริ่มมือ หรือมือเพิ่งจบ */
    if (view.phase === "waiting" || view.phase === "showdown") {
      /* เหตุผลที่กดไม่ได้ต้องตรงกับความจริง
         ของเดิมขึ้น "ต้องมีอย่างน้อย 2 คน" ทุกกรณี ทั้งที่ปกติคนครบอยู่แล้ว
         แค่มีคนชิปหมด คนเล่นจึงงงว่าทำไมจบมือแล้วเล่นต่อไม่ได้ */
      var alive = view.seats.filter(function (s) { return s && s.connected && !s.sitOut; });
      var broke = alive.filter(function (s) { return s.stack <= 0; });
      var why = null;
      if (view.limit && view.limit.over) why = "รอบเล่นนี้จบแล้ว";
      else if (view.readyCount < 2) {
        if (alive.length < 2) why = "ต้องมีอย่างน้อย 2 คน";
        else if (me.stack <= 0) why = "ชิปคุณหมด กดเติมชิปก่อน";
        else why = "รอ " + broke.map(function (s) { return s.name; }).join(" · ") + " เติมชิป";
      }
      var start = mkBtn("act act--raise",
        view.phase === "showdown" ? "มือต่อไป" : "เริ่มเล่น", why,
        function () { send({ type: "start" }); });
      start.disabled = !!why;
      row.appendChild(start);

      /* ชิปน้อยกว่า 10 บิ๊กบลายด์ ก็ควรเติมได้แล้ว ไม่ต้องรอให้หมดเกลี้ยง */
      if (me.stack < view.blinds.bb * 10) {
        row.appendChild(mkBtn("act", "เติมชิป", null, function () {
          openAmount("เติมชิปเท่าไหร่", view.buyInRange.min, view.buyInRange.max,
            view.buyInRange.suggested, function (v) { send({ type: "rebuy", amount: v }); });
        }));
      }
      return;
    }

    /* ไม่ใช่ตาเรา */
    if (view.current !== mySeat) {
      var who = view.seats[view.current];
      var wait = document.createElement("div");
      wait.className = "waitbar";
      wait.innerHTML = "<div class='msg'>" +
        (me.folded ? "คุณหมอบแล้ว" : (me.allIn ? "คุณหมดหน้าตักแล้ว" : "รอ " + (who ? who.name : "—"))) +
        "</div>";
      row.appendChild(wait);
      return;
    }

    var toCall = view.toCall;
    var maxTarget = me.stack + me.bet;

    row.appendChild(mkBtn("act act--fold", "หมอบ", null, function () {
      send({ type: "act", action: "fold" });
    }));

    if (toCall > 0) {
      var canCall = Math.min(toCall, me.stack);
      /* ตามแล้วหมดตักพอดี ก็คือ all-in อยู่แล้ว ไม่ต้องมีสองปุ่มที่ทำเหมือนกัน */
      var callIsAllIn = me.stack <= toCall;
      row.appendChild(mkBtn("act act--call",
        callIsAllIn ? "หมดหน้าตัก" : "ตาม",
        canCall.toLocaleString("th-TH"), function () {
        send({ type: "act", action: "call" });
      }));
    } else {
      row.appendChild(mkBtn("act act--call", "เคาะ", null, function () {
        send({ type: "act", action: "check" });
      }));
    }

    /* เพิ่มเดิมพันได้เมื่อยังมีชิปเหลือมากกว่าที่ต้องตาม */
    if (me.stack > toCall) {
      var minTarget = Math.min(view.currentBet + view.minRaise, maxTarget);
      var raiseBtn = mkBtn("act act--raise", toCall > 0 ? "เพิ่ม" : "เดิมพัน", null, function () {
        openRaise(minTarget, maxTarget);
      });
      row.appendChild(raiseBtn);
    }
  }

  function mkBtn(cls, label, sub, onClick) {
    var b = document.createElement("button");
    b.type = "button";
    b.className = cls;
    b.textContent = label;
    if (sub) {
      var s = document.createElement("small");
      s.textContent = sub;
      b.appendChild(s);
    }
    b.addEventListener("click", onClick);
    return b;
  }

  /* ---------- แผงใส่จำนวนเงิน ---------- */

  var betMin = 0, betMax = 0, betVal = 0, betTyping = false;

  function clampBet(v) {
    if (!isFinite(v)) v = betMin;
    return Math.max(betMin, Math.min(betMax, Math.floor(v)));
  }

  function paintBet() { paintBetRaw(); }

  /* วาดเลขตามที่พิมพ์จริง แล้วบอกว่ายังใช้ไม่ได้ถ้าต่ำกว่าขั้นต่ำ
     ปุ่มตกลงจะกดไม่ได้จนกว่าจะถึงขั้นต่ำ */
  function paintBetRaw() {
    var okNow = betVal >= betMin && betVal <= betMax;
    $("bet-num").textContent = betVal.toLocaleString("th-TH");
    $("bet-num").style.color = okNow ? "var(--gold)" : "#ff8f84";
    $("bet-hint").textContent = okNow
      ? "ต่ำสุด " + betMin.toLocaleString("th-TH") + " · สูงสุด " + betMax.toLocaleString("th-TH")
      : "ต้องอย่างน้อย " + betMin.toLocaleString("th-TH");
    var ok = document.querySelector(".pad--ok");
    if (ok) ok.disabled = !okNow;
  }

  function setBet(v) { betVal = clampBet(v); paintBet(); }

  var betOnConfirm = null;   /* null = ส่งเป็นการเพิ่มเดิมพัน */

  /* ใช้แผงเดิมกับงานอื่นได้ เช่นเติมชิป */
  function openAmount(label, mn, mx, start, onOk) {
    betMin = mn; betMax = mx; betVal = start; betTyping = false;
    betOnConfirm = onOk;
    $("bet-label").textContent = label;
    $("bet-quick").innerHTML = "";
    paintBetRaw();
    $("bet-sheet").classList.add("is-on");
  }

  function openRaise(minTarget, maxTarget) {
    betOnConfirm = null;
    betMin = minTarget;
    betMax = maxTarget;
    betVal = minTarget;
    betTyping = false;
    $("bet-label").textContent = view.toCall > 0 ? "เพิ่มเป็น" : "เดิมพัน";
    paintBet();

    /* ปุ่มลัด */
    var quick = $("bet-quick");
    quick.innerHTML = "";
    /* ขนาดกองตามหลักโป๊กเกอร์: ตามก่อน แล้วเพิ่มเท่ากองหลังตามแล้ว
       เช่น กอง 30 ต้องตาม 20 -> เพิ่มเป็น 20 + (30+20) = 70 */
    /* คิดจากกองส่วนที่มีคนตามแล้ว ไม่ใช่เงินที่ยังไม่มีใครตาม */
    var potBase = (typeof view.potForBet === "number" ? view.potForBet : view.pot);
    var potAfterCall = potBase + view.toCall;
    [
      { label: "ต่ำสุด", value: minTarget },
      { label: "½ กอง", value: view.currentBet + Math.round(potAfterCall / 2) },
      { label: "กอง",   value: view.currentBet + potAfterCall },
      { label: "หมดตัก", value: maxTarget }
    ].forEach(function (q) {
      /* ปุ่มลัดต้องกดแล้วใช้ได้จริง ถ้าคำนวณออกมาต่ำกว่าขั้นต่ำก็ดันขึ้นเป็นขั้นต่ำ
         ถ้าเกินหน้าตักก็หยุดที่หมดตัก ไม่งั้นกดแล้วเลขแดง ปุ่มตกลงกดไม่ได้ */
      q.value = Math.max(minTarget, Math.min(maxTarget, q.value));
      var b = document.createElement("button");
      b.type = "button";
      b.className = "qbtn";
      b.textContent = q.label;
      b.addEventListener("click", function () { betTyping = false; setBet(q.value); });
      quick.appendChild(b);
    });

    $("bet-sheet").classList.add("is-on");
  }

  function closeRaise() {
    $("bet-sheet").classList.remove("is-on");
    paintActions();
  }

  /* แป้นตัวเลข */
  (function buildPad() {
    var pad = $("bet-pad");
    var keys = ["7","8","9","del","4","5","6","ok","1","2","3","cancel","0","000"];
    keys.forEach(function (k) {
      var b = document.createElement("button");
      b.type = "button";
      if (k === "del")        { b.textContent = "⌫"; }
      else if (k === "ok")    { b.textContent = "ตกลง"; b.className = "pad--ok"; }
      else if (k === "cancel"){ b.textContent = "ยกเลิก"; b.className = "pad--cancel"; }
      else                    { b.textContent = k; }

      b.addEventListener("click", function () {
        if (k === "ok") {
          if (betVal < betMin || betVal > betMax) return;
          if (betOnConfirm) { var f = betOnConfirm; betOnConfirm = null; f(betVal); }
          else send({ type: "act", action: "raise", amount: betVal });
          $("bet-sheet").classList.remove("is-on");
          return;
        }
        if (k === "cancel") { closeRaise(); return; }
        if (k === "del") {
          /* ลบจากเลขที่เห็นอยู่จริงเสมอ ไม่ว่าจะเพิ่งพิมพ์หรือยัง */
          var s2 = String(betVal).slice(0, -1);
          betVal = s2 ? Number(s2) : 0;
          betTyping = true;
          paintBetRaw();
          return;
        }
        /* ห้าม clamp ระหว่างพิมพ์ ไม่งั้นพิมพ์ผิดตัวเดียวกลายเป็นหมดหน้าตัก
           ถ้าเกินหน้าตักให้ไม่รับตัวเลขนั้นไปเลย */
        var cur = betTyping ? String(betVal) : "";
        var next = Number(cur + k);
        if (next > betMax) return;
        betVal = next;
        betTyping = true;
        paintBetRaw();
      });
      pad.appendChild(b);
    });
  })();

  /* ปุ่ม - / + ขยับทีละบิ๊กบลายด์ */
  $("bet-minus").addEventListener("click", function () {
    betTyping = false;
    setBet(betVal - (view ? view.blinds.bb : 1));
  });
  $("bet-plus").addEventListener("click", function () {
    betTyping = false;
    setBet(betVal + (view ? view.blinds.bb : 1));
  });
  $("bet-sheet").addEventListener("click", function (e) {
    if (e.target === $("bet-sheet")) closeRaise();
  });

  /* ---------- เวลา/ตาที่เหลือ ---------- */

  var tickTimer = null;

  function fmtMs(ms) {
    var total = Math.ceil(ms / 1000);
    var m = Math.floor(total / 60), sec = total % 60;
    return m + ":" + (sec < 10 ? "0" : "") + sec;
  }

  function paintLimit() {
    var el = $("t-left");
    var L = view.limit;
    if (!L || L.type === "none") { el.textContent = ""; stopTick(); return; }

    if (L.type === "hands") {
      el.textContent = L.over ? "จบรอบเล่นแล้ว" : "เหลือ " + L.handsLeft + " ตา";
      stopTick();
      return;
    }

    /* นับถอยหลังในเครื่องเอง จะได้ไม่ต้องยิงข้อความถี่ๆ */
    stopTick();
    if (L.over) { el.textContent = "จบรอบเล่นแล้ว"; return; }
    var endAt = Date.now() + (L.msLeft || 0);
    function tick() {
      var left = endAt - Date.now();
      if (left <= 0) {
        el.textContent = "หมดเวลา · เล่นตานี้ให้จบ";
        stopTick();
        return;
      }
      el.textContent = "เหลือ " + fmtMs(left);
    }
    tick();
    tickTimer = setInterval(tick, 1000);
  }

  function stopTick() { if (tickTimer) { clearInterval(tickTimer); tickTimer = null; } }

  /* ---------- สรุปตอนจบรอบเล่น ---------- */

  function paintStandings() {
    var box = $("t-standings");
    var area = $("table-area");
    if (!view.limit || !view.limit.over || !view.standings) {
      box.classList.remove("is-on");
      area.classList.remove("is-over");
      return;
    }
    /* จบรอบเล่นแล้ว ซ่อนไพ่กลาง/กองกลางไปเลย ตารางอันดับจะได้ใช้พื้นที่ได้เต็ม */
    area.classList.add("is-over");

    box.innerHTML = "";
    var h = document.createElement("h3");
    h.textContent = "จบรอบเล่น";
    box.appendChild(h);

    var sub = document.createElement("p");
    sub.style.cssText = "margin:0 0 8px; font-size:.8rem; color:var(--muted)";
    sub.textContent = view.limit.type === "hands"
      ? "ครบ " + view.limit.value + " ตาแล้ว"
      : "ครบ " + view.limit.value + " นาทีแล้ว";
    box.appendChild(sub);

    /* อันดับ 9 คนเลื่อนในกล่องของมันเอง ส่วนปุ่มอยู่กับที่เสมอ
       ของเดิมปุ่มจมอยู่ใต้ขอบล่าง คนอันดับ 6-9 ก็ไม่เห็นผลตัวเอง */
    var rows = document.createElement("div");
    rows.className = "rows";
    view.standings.forEach(function (p, i) {
      var row = document.createElement("div");
      row.className = "row";
      var left = document.createElement("span");
      left.textContent = (i + 1) + ". " + p.name;
      var right = document.createElement("b");
      right.textContent = (p.net >= 0 ? "+" : "") + p.net.toLocaleString("th-TH");
      right.style.color = p.net > 0 ? "var(--good)" : (p.net < 0 ? "#ff8f84" : "var(--muted)");
      row.appendChild(left);
      row.appendChild(right);
      rows.appendChild(row);
    });
    box.appendChild(rows);

    var foot = document.createElement("div");
    foot.className = "foot";
    var again = document.createElement("button");
    again.type = "button";
    again.className = "btn-main";
    again.textContent = "เริ่มรอบเล่นใหม่";
    again.addEventListener("click", function () { send({ type: "newsession" }); });
    foot.appendChild(again);
    box.appendChild(foot);

    box.classList.add("is-on");
  }

  /* ---------- ผลมือที่จบ ---------- */

  function paintResult() {
    var box = $("t-result");
    var r = view.lastResult;
    /* จบรอบเล่นแล้วให้โชว์แค่สรุปรวม ไม่งั้นสองกล่องซ้อนกันอ่านไม่ออก */
    if (!r || view.phase !== "showdown" || (view.limit && view.limit.over)) {
      box.classList.remove("is-on"); box.classList.remove("is-pop"); return;
    }

    /* กล่องผลเด้งขึ้นมาครั้งเดียวตอนเปิดไพ่ ไม่ใช่ทุกครั้งที่วาดใหม่
       ไม่งั้นมันจะกระตุกซ้ำทุกครั้งที่มีคนกดอะไรสักอย่าง */
    if (justRevealed) box.classList.add("is-pop");
    else if (view.handNo !== lastRevealHand) box.classList.remove("is-pop");

    box.innerHTML = "";
    var h = document.createElement("h3");
    h.textContent = r.showdown ? "เปิดไพ่" : "จบมือ";
    box.appendChild(h);

    /* ต้องห่อด้วย .rows เหมือนตารางอันดับ ไม่งั้นแถวไม่ได้กติกาเลื่อน
       แล้วแถวที่ 3 ขึ้นไปจะล้นออกนอกขอบกล่อง */
    var rows = document.createElement("div");
    rows.className = "rows";
    r.payouts.forEach(function (p) {
      var row = document.createElement("div");
      row.className = "row";
      var left = document.createElement("span");
      var rv = r.reveal.filter(function (x) { return x.seatId === p.seatId; })[0];
      left.innerHTML = p.name + (rv ? " <span class='hand-lbl'>" + rv.hand + "</span>" : "");
      var right = document.createElement("b");
      right.textContent = "+" + p.amount.toLocaleString("th-TH");
      row.appendChild(left);
      row.appendChild(right);
      rows.appendChild(row);
    });
    box.appendChild(rows);

    box.classList.add("is-on");
  }

})();
</script>
</body>
</html>
